# Despertador da secretária: chama o servidor a cada 10 minutos para ele não
# dormir (Render grátis) e para disparar plano, fechamento e lembretes.
# Rodando à mão (Actions > Secretária > Run workflow), também mostra o status.
name: Secretária

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  SECRETARIA_URL: "https://secretaria-5mbt.onrender.com"   # endereço do servidor no Render

jobs:
  despertar:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar e rodar as rotinas
        run: |
          URL="${{ vars.SECRETARIA_URL }}"
          URL="${URL:-$SECRETARIA_URL}"
          if [ -z "$URL" ]; then echo "SECRETARIA_URL ainda não foi definido"; exit 0; fi
          for tentativa in 1 2 3; do
            if curl -fsS --max-time 90 "$URL/secretaria/tick"; then echo; break; fi
            echo "tentativa $tentativa falhou; o servidor pode estar acordando"; sleep 20
          done
          echo "--- status ---"
          curl -fsS --max-time 60 "$URL/secretaria/status" && echo
          echo "--- app ---"
          curl -fsS -o /dev/null -w "manifesto: HTTP %{http_code}\n" "$URL/app/manifest.webmanifest"
