      el.innerHTML = chatHtml + tabBar + this._htmlBalanco();
      Chat.renderHistorico();
      return;
    }
    // ── Este Mês ─────────────────────────────────────────────
    const fluxo  = Fin.fluxoCaixa(mes, ano);
    const cartoes = Storage.cartoes();
    const cats   = Fin.despesasPorCategoria(mes, ano);
    const txs    = Storage.transacoes()
      .filter(t => Utils.datasNoMes(t.data, mes, ano))
      .sort((a,b) => b.data.localeCompare(a.data))
      .slice(0, 10);
    const allCats = Storage.categorias();
    const contas  = Storage.contas();
    const carts   = Storage.cartoes();

      .filter(i => Utils.datasNoMes(i.data, mes, ano))
      .reduce((a,i) => a+i.valor, 0);
    const podeGastar = fluxo.resultado - (meta - investMes);
    let alertaHtml = '';
    if (fluxo.entradas > 0) {
      if (podeGastar < 0) {
        alertaHtml = `<div class="alerta-invest critico">⚠️ <strong>Atenção!</strong> Com as saídas atuais, o investimento de ${Utils.moeda(meta)} está comprometido em ${Utils.moeda(Math.abs(podeGastar))}.</div>`;

        alertaHtml = `<div class="alerta-invest medio">⚡ Cuidado! Você ainda pode gastar <strong>${Utils.moeda(podeGastar)}</strong> sem comprometer o investimento de ${Utils.moeda(meta)}.</div>`;
      } else {
        alertaHtml = `<div class="alerta-invest ok">✅ Tudo certo! Pode gastar até <strong>${Utils.moeda(podeGastar)}</strong> e ainda investir ${Utils.moeda(meta)} este mês.</div>`;
      }
    }

    // ── Bloco de progresso do investimento ─────────────────
    const investPct  = meta > 0 ? Math.min(100, Math.round(investMes / meta * 100)) : 0;
    const investFalta = Math.max(0, meta - investMes);
    const diasMes   = new Date(ano, mes, 0).getDate();
    const diasRestantes = mes === new Date().getMonth()+1 && ano === new Date().getFullYear()
      ? diasMes - new Date().getDate() : 0;
    const investClasse = investPct >= 100 ? 'var(--receita)' : investPct >= 60 ? 'var(--aviso)' : 'var(--despesa)';
    const investProgressHtml = meta > 0 ? `
      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:14px;font-weight:700">💹 Meta de Investimento</span>
          <span style="font-size:13px;color:${investClasse};font-weight:700">${investPct}%</span>
        </div>
        <div style="background:var(--sup2);border-radius:6px;height:8px;overflow:hidden;margin-bottom:8px">
          <div style="height:100%;width:${investPct}%;background:${investClasse};border-radius:6px;transition:width .4s"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--txt2)">
          <span>Investido: <strong style="color:var(--receita)">${Utils.moeda(investMes)}</strong> / ${Utils.moeda(meta)}</span>
          ${investPct >= 100
            ? `<span style="color:var(--receita);font-weight:700">🎉 Meta atingida!</span>`
            : diasRestantes > 0
              ? `<span>Falta <strong style="color:${investClasse}">${Utils.moeda(investFalta)}</strong> em ${diasRestantes}d</span>`
              : `<span>Falta <strong style="color:${investClasse}">${Utils.moeda(investFalta)}</strong></span>`}
        </div>
      </div>` : '';

    // ── Análise "Onde posso cortar?" ────────────────────────
    const cortes = Fin.analisarCortes(mes, ano);
    const cortesAcima = cortes.filter(c => c.diff > 5 && c.temHistorico);
    let cortesHtml = '';
    if (cortesAcima.length) {
      const economia = cortesAcima.reduce((a,c) => a + c.diff, 0);
      cortesHtml = `
        <h2 style="font-size:15px;font-weight:700;margin:20px 0 8px">🔍 Onde posso cortar?</h2>
        <div class="card">
          <div style="font-size:12px;color:var(--txt2);margin-bottom:12px">Comparado com a média dos últimos 3 meses. Economizando aqui você libera até <strong style="color:var(--receita)">${Utils.moeda(economia)}</strong> para investir.</div>
          ${cortesAcima.slice(0,5).map(c => {
            const pctAcima = c.media > 0 ? Math.round((c.diff / c.media) * 100) : 100;
            return `<div style="margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:4px">
                <span>${c.ico} <strong>${Utils.esc(c.nome)}</strong></span>
                <span style="color:var(--despesa);font-weight:700">+${Utils.moeda(c.diff)} acima</span>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--txt2);margin-bottom:4px">
                <span>Este mês: ${Utils.moeda(c.atual)}</span>
                <span>Média 3 meses: ${Utils.moeda(c.media)}</span>
              </div>
              <div style="background:var(--sup2);border-radius:4px;height:5px;overflow:hidden;position:relative">
                <div style="height:100%;width:${Math.min(100, Math.round(c.media/c.atual*100))}%;background:var(--receita);border-radius:4px"></div>
                <div style="position:absolute;top:0;left:${Math.min(100, Math.round(c.media/c.atual*100))}%;height:100%;width:${100-Math.min(100, Math.round(c.media/c.atual*100))}%;background:var(--despesa);border-radius:0 4px 4px 0"></div>
              </div>
              <div style="font-size:11px;color:var(--txt2);margin-top:3px">Se ficar na média, economiza <strong>${Utils.moeda(c.diff)}</strong> (${pctAcima}% a mais que o normal)</div>
            </div>`;
          }).join('')}
          ${cortes.filter(c => c.diff <= 5 || !c.temHistorico).length > 0
            ? `<div style="font-size:12px;color:var(--receita);padding-top:8px;border-top:1px solid var(--borda)">✅ ${cortes.filter(c => c.diff <= 5 || !c.temHistorico).length} categorias dentro ou abaixo da média</div>`
            : ''}
        </div>`;
    } else if (cortes.length > 0) {
      cortesHtml = `
        <div class="card" style="margin-top:16px">
          <div style="text-align:center;padding:8px 0">
            <div style="font-size:24px;margin-bottom:6px">✅</div>
            <div style="font-size:13px;font-weight:700;color:var(--receita)">Gastos dentro da média!</div>
            <div style="font-size:12px;color:var(--txt2);margin-top:4px">Nenhuma categoria com gasto acima do histórico.</div>
          </div>
        </div>`;
    }

    let cartoesHtml = '';
    if (cartoes.length) {
      cartoesHtml = `<h2 style="font-size:15px;font-weight:700;margin:20px 0 12px">Faturas dos Cartões</h2><div class="card-grid">`;
      for (const c of cartoes) {
        const { fechado, aberto } = Fin._periodosFatura(c);
        const fatFec  = Fin.faturaCartao(c.id, fechado.mes, fechado.ano);
        const fatAb   = Fin.faturaCartao(c.id, aberto.mes,  aberto.ano);
        const comprom = Fin.totalComprometido(c.id);
        const pctD    = c.limite ? Math.min(100, Math.round(comprom/c.limite*100)) : 0;
        const clsD    = pctD<70?'barra-ok':pctD<90?'barra-med':'barra-alto';
        cartoesHtml += `<div class="card" style="border-left:4px solid ${Utils.esc(c.cor)}">
          <div style="font-weight:700;margin-bottom:8px">${Utils.esc(c.nome)}</div>
          <div onclick="FaturaDetalhe.abrir('${c.id}',${fechado.mes},${fechado.ano})" style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px;cursor:pointer;padding:4px 6px;margin:-4px -6px 2px;border-radius:6px;transition:background .15s" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="this.style.background=''">
            <span style="color:var(--txt2)">🔴 A pagar (vence ${c.diaVencimento}/${String(fechado.mes).padStart(2,'0')})</span>
            <strong style="color:${fatFec>0?'var(--despesa)':'var(--txt2)'}">${Utils.moeda(fatFec)} ›</strong></div>
          <div onclick="FaturaDetalhe.abrir('${c.id}',${aberto.mes},${aberto.ano})" style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;cursor:pointer;padding:4px 6px;margin:-4px -6px 4px;border-radius:6px;transition:background .15s" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="this.style.background=''">
            <span style="color:var(--txt2)">🟡 Em aberto (fecha ${c.diaFechamento}/${String(aberto.mes).padStart(2,'0')})</span>
            <strong style="color:${fatAb>0?'#f5a623':'var(--txt2)'}">${Utils.moeda(fatAb)} ›</strong></div>
          <div class="barra-wrap"><div class="barra-fill ${clsD}" style="width:${pctD}%"></div></div>
          <div style="font-size:12px;color:var(--txt2)">Disponível real: <strong style="color:${(c.limite-comprom)>=0?'var(--receita)':'var(--despesa)'}">${Utils.moeda(c.limite-comprom)}</strong></div>
        </div>`;
      }
      cartoesHtml += `</div>`;
    }

    let recTxHtml = '';
    if (txs.length) {
      recTxHtml = `<h2 style="font-size:15px;font-weight:700;margin:20px 0 12px">Últimos Lançamentos</h2><div class="card">`;
      let dataAtual = '';
      for (const t of txs) {
        if (t.data !== dataAtual) { dataAtual = t.data; recTxHtml += `<div class="sep-data">${Utils.formatarData(t.data)}</div>`; }
        const cat   = allCats.find(c=>c.id===t.categoria);
        const conta = contas.find(c=>c.id===t.contaId);
        const cart  = carts.find(c=>c.id===t.cartaoId);
        const cor   = t.tipo==='receita'?'var(--receita)':t.tipo==='fatura_cartao'?'var(--despesa)':t.tipo==='despesa'?'var(--despesa)':'var(--txt2)';
        const sinal = t.tipo==='receita'?'+':'-';
        recTxHtml += `<div class="lista-item">
          <div class="ico-cat" style="background:${(cat?.cor||'#444')+'22'}">${cat?.ico||'📦'}</div>
          <div class="lista-info">
            <div class="lista-titulo">${Utils.esc(t.descricao)}</div>
            <div class="lista-sub">${Utils.esc(cart?.nome||conta?.nome||'')}</div>
          </div>
          <div class="lista-valor" style="color:${cor}">${sinal}${Utils.moeda(t.valor)}</div>
        </div>`;
      }
      recTxHtml += `</div>`;
    }

    const orcHtml = this._htmlOrcamento(mes, ano);
    const totalCatDep = cats.reduce((a,c) => a+c.total, 0);
    const resCls = fluxo.resultado >= 0 ? 'pos' : 'neg';

    // Metas por categoria
    const metasObj = Storage.metas();
    const allCatsDesp = Storage.categorias().filter(c => c.tipo !== 'receita');
    const metasComs = allCatsDesp.filter(c => metasObj[c.id] > 0);
    let metasHtml = '';
    if (metasComs.length) {
      metasHtml = `<h2 style="font-size:15px;font-weight:700;margin:20px 0 12px">🎯 Metas do Mês</h2><div class="card">`;
      for (const c of metasComs) {
        const meta = metasObj[c.id];
        const gasto = Fin.gastoCategoriaMes(c.id, mes, ano);
        const pct = Math.min(100, Math.round(gasto / meta * 100));
        const corBarra = pct < 70 ? 'var(--receita)' : pct < 90 ? 'var(--aviso)' : 'var(--despesa)';
        metasHtml += `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
            <span>${c.ico} ${Utils.esc(c.nome)}: <strong>${Utils.moeda(gasto)}</strong> / ${Utils.moeda(meta)}</span>
            <span style="color:${corBarra};font-weight:700">${pct}%</span>
          </div>
          <div style="background:var(--sup2);border-radius:4px;height:6px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${corBarra};border-radius:4px;transition:width .3s"></div>
          </div>
        </div>`;
      }
      metasHtml += `</div>`;
    }

    el.innerHTML = chatHtml + alertaHtml + tabBar + mesNav + `
      <div class="card-resumo" style="grid-template-columns:repeat(3,1fr)">
        <div class="card c-receita">
          <div class="card-label">Entrou no mês</div>
          <div class="card-valor pos">${Utils.moeda(fluxo.entradas)}</div>
          <div style="font-size:10px;color:var(--txt2);margin-top:2px">receitas recebidas</div>
        </div>
        <div class="card c-despesa">
          <div class="card-label">Saiu do banco</div>
          <div class="card-valor neg">${Utils.moeda(fluxo.saidas)}</div>
          <div style="font-size:10px;color:var(--txt2);margin-top:2px">pagamentos + faturas pagas</div>
        </div>
        <div class="card" style="border-left:3px solid ${fluxo.resultado>=0?'var(--receita)':'var(--despesa)'}">
          <div class="card-label">Sobrou</div>
          <div class="card-valor ${resCls}">${Utils.moeda(fluxo.resultado)}</div>
          <div style="font-size:10px;color:var(--txt2);margin-top:2px">entrou − saiu</div>
        </div>
      </div>
      ${recTxHtml}
      ${investProgressHtml}
      ${cartoesHtml}
      ${metasHtml}
      ${orcHtml}
      ${cats.length ? `
        <h2 style="font-size:15px;font-weight:700;margin:20px 0 12px">Gastos por Categoria</h2>
        <div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
          <canvas id="cv-donut" width="160" height="160"></canvas>
          <div style="flex:1;min-width:160px">
            ${cats.slice(0,6).map(c=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
              <div style="width:10px;height:10px;border-radius:50%;background:${c.cor};flex-shrink:0"></div>
              <div style="flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.ico} ${Utils.esc(c.nome)}</div>
              <div style="font-size:12px;font-weight:700;color:var(--despesa)">${Utils.moeda(c.total)}</div>
            </div>`).join('')}
          </div>
        </div>` : ''}
      ${cortesHtml}`;
    if (cats.length) Graf.donut('cv-donut', cats, totalCatDep);
    Chat.renderHistorico();
  },

  _htmlOrcamento(mes, ano) {
    const orc = Fin.orcamento5030(mes, ano);
    if (orc.receita === 0) return '';
    const recs = Storage.recompensas();
    const streak = (() => { let s=0; const sorted=[...recs].sort((a,b)=>b.mesAno.localeCompare(a.mesAno)); for(const r of sorted){if(r.ok)s++;else break;} return s; })();

    const bucket = (nome, ico, pct, gasto, alvo, ok, isInvest) => {
      const overrun = isInvest ? pct < 100 : pct > 100;
      const cls = overrun ? 'alto' : (isInvest ? (pct>=80?'ok':'med') : (pct<80?'ok':'med'));
      const barW = isInvest ? Math.min(100,pct) : Math.min(100,pct);
      return `<div class="orc-bucket">
        <div class="orc-header">
          <span class="orc-nome">${ico} ${nome}</span>
          <span class="orc-nums">${Utils.moeda(gasto)} / ${Utils.moeda(alvo)} (${pct}%)</span>
        </div>
        <div class="orc-barra-wrap"><div class="orc-barra ${cls}" style="width:${barW}%"></div></div>
        <div class="orc-rodape">
          <span>${isInvest ? 'mínimo' : 'limite'}: ${Utils.moeda(alvo)}</span>
          <span style="color:${overrun?'var(--despesa)':ok?'var(--receita)':'#f5a623'}">${overrun?(isInvest?'⚠️ Abaixo da meta':'⚠️ Acima do limite'):ok?'✅ Ok':'⚡ Atenção'}</span>
        </div>
      </div>`;
    };

    const todosOk = orc.essencial.ok && orc.investimento.ok && orc.lazer.ok;
    const perfeitoHtml = todosOk ? `<div class="mes-perfeito"><span style="font-size:28px">🏆</span><div><strong>Mês no caminho certo!</strong><div style="font-size:12px;color:var(--txt2)">Você está dentro das metas 50-30-20 este mês.</div></div></div>` : '';
    const streakHtml = streak > 0 ? `<div><span class="streak-badge">🔥 ${streak} ${streak===1?'mês':'meses'} seguidos no controle</span></div>` : '';

    return `<h2 style="font-size:15px;font-weight:700;margin:20px 0 10px">Regra 50·30·20</h2>
      <div class="card orc-section">
        ${streakHtml}${perfeitoHtml}
        <div style="font-size:12px;color:var(--txt2);margin-bottom:14px">Baseado em ${Utils.moeda(orc.receita)} de receita este mês</div>
        ${bucket('Essencial (50%)','🔴',orc.essencial.pct,orc.essencial.gasto,orc.essencial.alvo,orc.essencial.ok,false)}
        ${bucket('Investimento (30%)','💎',orc.investimento.pct,orc.investimento.gasto,orc.investimento.alvo,orc.investimento.ok,true)}
        ${bucket('Lazer (20%)','🎮',orc.lazer.pct,orc.lazer.gasto,orc.lazer.alvo,orc.lazer.ok,false)}
      </div>`;
  },

  _htmlBalanco() {
    const { mes, ano } = this._ref;
    const total    = Fin.saldoTotal();
    const cartoes  = Storage.cartoes();
    const contas   = Storage.contas();
    const fatFech  = cartoes.reduce((acc, c) => acc + Fin.faturaFechada(c.id), 0);
    const saldoLiq = total - fatFech;
    const anual    = Fin.resumoAnual(ano);
    const mensal   = Fin.fluxoCaixa(mes, ano);

    const contasHtml = contas.map(c => {
      const saldo = Fin.saldoConta(c.id);
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--borda)">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:10px;height:10px;border-radius:50%;background:${Utils.esc(c.cor)}"></div>
          <span style="font-size:13px">${Utils.esc(c.nome)}</span>
        </div>
        <strong style="color:${saldo>=0?'var(--receita)':'var(--despesa)'}">${Utils.moeda(saldo)}</strong>
      </div>`;
    }).join('');

    const mesNav = `
      <div class="mes-nav" style="margin:0 0 16px">
        <button onclick="Telas.dashboard._mudarMes(-1)">◀</button>
        <span class="mes-nome">${Utils.nomeMes(mes,ano)}</span>
        <button onclick="Telas.dashboard._mudarMes(1)">▶</button>
      </div>`;

    return `${mesNav}
      <h2 style="font-size:14px;font-weight:700;margin:0 0 10px;color:var(--txt2);text-transform:uppercase;letter-spacing:1px">Patrimônio Atual</h2>
      <div class="card-resumo" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">
        <div class="card">
          <div class="card-label">Saldo nas Contas</div>
          <div class="card-valor ${total>=0?'pos':'neg'}">${Utils.moeda(total)}</div>
        </div>
        <div class="card" style="border-left:3px solid var(--despesa)">
          <div class="card-label">Faturas a Pagar</div>
          <div class="card-valor neg">${Utils.moeda(fatFech)}</div>
        </div>
        <div class="card" style="border-left:3px solid #f5a623">
          <div class="card-label">Saldo Líquido</div>
          <div class="card-label" style="font-size:10px;margin-bottom:2px">(contas − faturas)</div>
          <div class="card-valor ${saldoLiq>=0?'pos':'neg'}">${Utils.moeda(saldoLiq)}</div>
        </div>
      </div>
      ${contas.length ? `
        <div class="card" style="margin-bottom:20px">
          <div style="font-size:13px;font-weight:700;margin-bottom:4px;color:var(--txt2)">Contas</div>
          ${contasHtml}
        </div>` : ''}
      <h2 style="font-size:14px;font-weight:700;margin:0 0 10px;color:var(--txt2);text-transform:uppercase;letter-spacing:1px">Ano ${ano} — Fluxo Acumulado</h2>
      <div class="card-resumo" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">
        <div class="card c-receita">
          <div class="card-label">Entrou no Ano</div>
          <div class="card-valor pos">${Utils.moeda(anual.entradas)}</div>
        </div>
        <div class="card c-despesa">
          <div class="card-label">Saiu no Ano</div>
          <div class="card-valor neg">${Utils.moeda(anual.saidas)}</div>
        </div>
        <div class="card" style="border-left:3px solid ${anual.resultado>=0?'var(--receita)':'var(--despesa)'}">
          <div class="card-label">Resultado ${ano}</div>
          <div class="card-valor ${anual.resultado>=0?'pos':'neg'}">${Utils.moeda(anual.resultado)}</div>
        </div>
      </div>
      <h2 style="font-size:14px;font-weight:700;margin:0 0 10px;color:var(--txt2);text-transform:uppercase;letter-spacing:1px">${Utils.nomeMes(mes,ano)} — Fluxo do Mês</h2>
      <div class="card-resumo" style="grid-template-columns:repeat(3,1fr)">
        <div class="card c-receita">
          <div class="card-label">Entrou</div>
          <div class="card-valor pos">${Utils.moeda(mensal.entradas)}</div>
        </div>
        <div class="card c-despesa">
          <div class="card-label">Saiu</div>
          <div class="card-valor neg">${Utils.moeda(mensal.saidas)}</div>
        </div>
        <div class="card" style="border-left:3px solid ${mensal.resultado>=0?'var(--receita)':'var(--despesa)'}">
          <div class="card-label">Resultado</div>
          <div class="card-valor ${mensal.resultado>=0?'pos':'neg'}">${Utils.moeda(mensal.resultado)}</div>
        </div>
      </div>`;
  },

  _mudarMes(d) {
    this._ref = Utils.addMes(this._ref.mes, this._ref.ano, d);
    this.render();
  }
};

/* ═══════════════════════════════════════════════════════════
   TELA: RELATÓRIOS
═══════════════════════════════════════════════════════════ */
Telas.relatorios = {
  _ref: Utils.mesAtual(),
  _aba: 'resumo',
  render() {
    const el = document.getElementById('tela-relatorios');
    el.innerHTML = `
      <div class="sec-header"><h1 class="sec-titulo">📊 Relatórios</h1></div>
      <div class="mes-nav">
        <button onclick="Telas.relatorios._mudarMes(-1)">◀</button>
        <span class="mes-nome">${Utils.nomeMes(this._ref.mes,this._ref.ano)}</span>
        <button onclick="Telas.relatorios._mudarMes(1)">▶</button>
      </div>
      <div class="tabs">
        <button class="tab-btn${this._aba==='resumo'?' ativo':''}" onclick="Telas.relatorios._aba='resumo';Telas.relatorios._renderAba()">Resumo</button>
        <button class="tab-btn${this._aba==='categoria'?' ativo':''}" onclick="Telas.relatorios._aba='categoria';Telas.relatorios._renderAba()">Categorias</button>
        <button class="tab-btn${this._aba==='faturas'?' ativo':''}" onclick="Telas.relatorios._aba='faturas';Telas.relatorios._renderAba()">Faturas</button>
        <button class="tab-btn${this._aba==='evolucao'?' ativo':''}" onclick="Telas.relatorios._aba='evolucao';Telas.relatorios._renderAba()">Evolução</button>
        <button class="tab-btn${this._aba==='conquistas'?' ativo':''}" onclick="Telas.relatorios._aba='conquistas';Telas.relatorios._renderAba()">Conquistas</button>
      </div>
      <div id="rel-aba-conteudo"></div>`;
    this._renderAba();
  },
  _htmlConquistas() {
    const recs = [...Storage.recompensas()].sort((a,b) => b.mesAno.localeCompare(a.mesAno));
    if (!recs.length) return `<div class="vazio"><div class="vazio-ico">🏆</div><p>Nenhum mês registrado ainda.<br>Continue usando o app e o histórico aparece aqui.</p></div>`;
    let streak = 0;
    for (const r of recs) { if (r.ok) streak++; else break; }
    const mesNome = ma => { const [m,a] = ma.split('-'); return Utils.nomeMes(parseInt(m),parseInt(a)); };
    const gridHtml = recs.map(r => `<div class="recomp-mes">
      <span class="recomp-ico">${r.ok ? '🏆' : '💔'}</span>
      <div>${mesNome(r.mesAno)}</div>
    </div>`).join('');
    const total = recs.length, perfeitos = recs.filter(r=>r.ok).length;
    return `<div class="card" style="text-align:center;margin-bottom:16px">
        <div style="font-size:40px;margin-bottom:8px">${streak>0?'🔥':'📊'}</div>
        <div style="font-size:22px;font-weight:700;margin-bottom:4px">${streak} ${streak===1?'mês':'meses'} seguidos</div>
        <div style="font-size:13px;color:var(--txt2)">${perfeitos} de ${total} meses dentro das metas</div>
      </div>
      <div class="card"><div style="font-size:13px;font-weight:700;color:var(--txt2);margin-bottom:14px">HISTÓRICO DE MESES</div>
        <div class="recomp-hist">${gridHtml}</div>
      </div>`;
  },
  _mudarMes(d) {
    this._ref = Utils.addMes(this._ref.mes, this._ref.ano, d);
    this.render();
  },
  _renderAba() {
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('ativo', b.textContent.toLowerCase().startsWith(
        this._aba==='categoria'?'cat':this._aba==='faturas'?'fat':this._aba==='evolucao'?'evo':'res'));
    });
    const { mes, ano } = this._ref;
    const el = document.getElementById('rel-aba-conteudo');
    if (!el) return;
    if (this._aba === 'resumo')    { el.innerHTML = this._htmlResumo(mes,ano); setTimeout(()=>this._drawSaldoEvolucao(),50); }
    if (this._aba === 'categoria') { el.innerHTML = this._htmlCategorias(mes,ano); }
    if (this._aba === 'faturas')   { el.innerHTML = this._htmlFaturas(mes,ano); }
    if (this._aba === 'evolucao')  { el.innerHTML = this._htmlEvolucao(); setTimeout(()=>this._drawEvolucao(),50); }
    if (this._aba === 'conquistas') { el.innerHTML = this._htmlConquistas(); }
  },
  _htmlResumo(mes,ano) {
    const r = Fin.resumoMensal(mes,ano);
    const desp = Fin.despesasPorCategoria(mes,ano);
    const rec  = Fin.receitasPorCategoria(mes,ano);
    const maxD = desp[0]?.total || 1;
    const maxR = rec[0]?.total || 1;
    return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px">
      <div class="card c-receita"><div class="card-label">Receitas</div><div class="card-valor pos">${Utils.moeda(r.receitas)}</div></div>
      <div class="card c-despesa"><div class="card-label">Despesas</div><div class="card-valor neg">${Utils.moeda(r.despesas)}</div></div>
    </div>
    <div class="card c-saldo" style="text-align:center;margin-bottom:20px">
      <div class="card-label">Saldo do Mês</div>
      <div class="card-valor ${r.saldo>=0?'pos':'neg'}" style="font-size:28px">${Utils.moeda(r.saldo)}</div>
    </div>
    ${desp.length?`<h3 style="font-size:13px;font-weight:700;color:var(--txt2);margin-bottom:10px">DESPESAS POR CATEGORIA</h3>
    <div class="card">${desp.map(c=>`
      <div class="rel-linha">
        <div class="rel-nome">${c.ico} ${Utils.esc(c.nome)}</div>
        <div class="rel-barra-wrap"><div class="rel-barra" style="width:${c.total/maxD*100}%;background:${c.cor}"></div></div>
        <div class="rel-val" style="color:var(--despesa)">${Utils.moeda(c.total)}</div>
        <div class="rel-pct">${c.pct}%</div>
      </div>`).join('')}</div>`:''}
    ${rec.length?`<h3 style="font-size:13px;font-weight:700;color:var(--txt2);margin:16px 0 10px">RECEITAS POR CATEGORIA</h3>
    <div class="card">${rec.map(c=>`
      <div class="rel-linha">
        <div class="rel-nome">${c.ico} ${Utils.esc(c.nome)}</div>
        <div class="rel-barra-wrap"><div class="rel-barra" style="width:${c.total/maxR*100}%;background:${c.cor}"></div></div>
        <div class="rel-val" style="color:var(--receita)">${Utils.moeda(c.total)}</div>
        <div class="rel-pct">${c.pct}%</div>
      </div>`).join('')}</div>`:''}
    <h3 style="font-size:13px;font-weight:700;color:var(--txt2);margin:20px 0 10px">EVOLUÇÃO DO SALDO (6 MESES)</h3>
    <div class="card">
      <div class="chart-wrap"><canvas id="cv-saldo-evo" width="600" height="180"></canvas></div>
    </div>`;
  },
  _drawSaldoEvolucao() {
    const dados = Fin.evolucaoSaldoMensal(6);
    Graf.barrasEvolucao('cv-saldo-evo', dados);
  },
  _htmlCategorias(mes,ano) {
    const desp = Fin.despesasPorCategoria(mes,ano);
    const totalDep = desp.reduce((a,c)=>a+c.total,0);
    if (!desp.length) return `<div class="vazio"><div class="vazio-ico">📊</div><p>Sem despesas neste mês.</p></div>`;
    const max = desp[0].total;
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--txt2);padding-bottom:10px;border-bottom:1px solid var(--borda);margin-bottom:6px">
        <span>Total de despesas</span><strong style="color:var(--despesa)">${Utils.moeda(totalDep)}</strong></div>
      ${desp.map(c=>`<div class="rel-linha" style="cursor:pointer" onclick="CatDetalhe.abrir('${c.id}',${mes},${ano})">
        <div class="rel-nome">${c.ico} ${Utils.esc(c.nome)}</div>
        <div class="rel-barra-wrap"><div class="rel-barra" style="width:${c.total/max*100}%;background:${c.cor}"></div></div>
        <div class="rel-val" style="color:var(--despesa)">${Utils.moeda(c.total)}</div>
        <div class="rel-pct">${c.pct}% ›</div>
      </div>`).join('')}
    </div>`;
  },
  _htmlFaturas(mes,ano) {
    const cartoes = Storage.cartoes();
    if (!cartoes.length) return `<div class="vazio"><div class="vazio-ico">💳</div><p>Nenhum cartão cadastrado.</p></div>`;
    let html = '';
    const allCats = Storage.categorias();
    for (const c of cartoes) {
      const per = Fin.periodoFatura(c, mes, ano);
      const txs = Fin.transacoesCartao(c.id, mes, ano);
      const total = txs.reduce((a,t)=>a+t.valor,0);
      html += `<div class="card" style="margin-bottom:14px;border-top:4px solid ${Utils.esc(c.cor)}">
        <div style="display:flex;justify-content:space-between;margin-bottom:12px">
          <div><strong>${Utils.esc(c.nome)}</strong><div style="font-size:12px;color:var(--txt2)">
            ${Utils.formatarData(per.inicio.toISOString().slice(0,10))} → ${Utils.formatarData(per.fim.toISOString().slice(0,10))}</div></div>
          <div style="text-align:right"><div style="font-size:20px;font-weight:700;color:var(--despesa)">${Utils.moeda(total)}</div>
            <div style="font-size:11px;color:var(--txt2)">Vence ${Utils.formatarData(per.vencimento.toISOString().slice(0,10))}</div></div>
        </div>
        ${txs.length ? txs.map(t=>{
          const cat = allCats.find(x=>x.id===t.categoria);
          return `<div class="lista-item">
            <div class="ico-cat" style="background:${(cat?.cor||'#444')+'22'}">${cat?.ico||'📦'}</div>
            <div class="lista-info"><div class="lista-titulo">${Utils.esc(t.descricao)}</div>
              <div class="lista-sub">${Utils.formatarData(t.data)}${t.parcelas>1?` (${t.parcelaAtual}/${t.parcelas}x)`:''}</div></div>
            <div class="lista-valor" style="color:var(--despesa)">${Utils.moeda(t.valor)}</div>
          </div>`;
        }).join('') : `<div style="color:var(--txt2);font-size:13px;text-align:center;padding:10px">Sem lançamentos neste período.</div>`}
      </div>`;
    }
    return html;
  },
  _htmlEvolucao() {
    return `<div class="card">
      <div style="display:flex;gap:16px;font-size:12px;margin-bottom:12px">
        <span style="display:flex;align-items:center;gap:6px"><span style="display:inline-block;width:12px;height:12px;background:var(--receita);border-radius:2px"></span>Receitas</span>
        <span style="display:flex;align-items:center;gap:6px"><span style="display:inline-block;width:12px;height:12px;background:var(--despesa);border-radius:2px"></span>Despesas</span>
      </div>
      <div class="chart-wrap"><canvas id="cv-barras" width="600" height="200"></canvas></div>
    </div>`;
  },
  _drawEvolucao() {
    const dados = Fin.evolucao(6);
    Graf.barras('cv-barras', dados);
  }
};

Telas.investimentos = {
  _ref: Utils.mesAtual(),
  render() {
    const { mes, ano } = this._ref;
    const meta = Storage.metaInvest();
    const todos = Storage.investimentos();
    const doMes = todos.filter(i => Utils.datasNoMes(i.data, mes, ano));
    const total = doMes.reduce((a,i)=>a+i.valor, 0);
    const pct   = meta ? Math.min(100, Math.round(total/meta*100)) : 0;
    const cls   = pct >= 100 ? 'barra-ok' : pct >= 60 ? 'barra-med' : 'barra-alto';
    const el = document.getElementById('tela-investimentos');
    el.innerHTML = `
      <div class="sec-header">
        <h1 class="sec-titulo">💹 Investimentos</h1>
        <button class="btn btn-ghost btn-sm" onclick="Telas.investimentos._editarMeta()">Meta: ${Utils.moeda(meta)}</button>
      </div>
      <div class="mes-nav">
        <button onclick="Telas.investimentos._mudarMes(-1)">◀</button>
        <span class="mes-nome">${Utils.nomeMes(mes,ano)}</span>
        <button onclick="Telas.investimentos._mudarMes(1)">▶</button>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="invest-nums">
          <span>Investido: <strong style="color:var(--receita)">${Utils.moeda(total)}</strong></span>
          <span>Meta: <strong>${Utils.moeda(meta)}</strong></span>
        </div>
        <div class="barra-wrap"><div class="barra-fill ${cls}" style="width:${pct}%"></div></div>
        <div style="font-size:12px;color:var(--txt2);margin-top:6px">
          ${pct >= 100 ? '🎉 Meta atingida!' : `Falta <strong>${Utils.moeda(meta - total)}</strong> para atingir a meta`}
        </div>
      </div>
      <div class="sec-header" style="margin-bottom:12px">
        <h2 style="font-size:15px;font-weight:700">Lançamentos</h2>
        <button class="btn btn-prim btn-sm" onclick="Telas.investimentos._novoManual()">+ Adicionar</button>
      </div>
      ${doMes.length ? `<div class="card">
        ${doMes.sort((a,b)=>b.data.localeCompare(a.data)).map(i=>`
          <div class="lista-item">
            <div class="ico-cat" style="background:rgba(6,214,160,.15)">📈</div>
            <div class="lista-info">
              <div class="lista-titulo">${Utils.esc(i.descricao)}</div>
              <div class="lista-sub">${Utils.formatarData(i.data)}</div>
            </div>
            <div class="lista-valor" style="color:var(--receita)">${Utils.moeda(i.valor)}</div>
            <div class="lista-acoes">
              <button class="btn btn-ghost btn-sm btn-icon" onclick="Telas.investimentos._excluir('${i.id}')">🗑️</button>
            </div>
          </div>`).join('')}
      </div>` : `<div class="vazio"><div class="vazio-ico">📈</div><p>Nenhum investimento registrado.<br>Use o chat ou o botão "+" para adicionar.</p></div>`}`;
  },
  _mudarMes(d) { this._ref = Utils.addMes(this._ref.mes, this._ref.ano, d); this.render(); },
  _editarMeta() {
    const meta = Storage.metaInvest();
    Modal.abrir('Meta de Investimento', `
      <div class="form-grupo"><label>Meta mensal (R$)</label>
        <input id="meta-val" type="number" step="50" min="0" value="${meta}">
        <div style="font-size:12px;color:var(--txt2);margin-top:6px">Você será alertado quando os gastos ameaçarem essa meta.</div>
      </div>`, { onOk: () => {
        const v = parseFloat(document.getElementById('meta-val').value) || 0;
        Storage.salvarMetaInvest(v);
        Modal.fechar(); this.render(); toast('Meta atualizada!');
    }});
  },
  _novoManual() {
    Modal.abrir('Novo Investimento', `
      <div class="form-row">
        <div class="form-grupo"><label>Data</label><input id="inv-data" type="date" value="${Utils.dataHoje()}"></div>
        <div class="form-grupo"><label>Valor (R$)</label>
          <input id="inv-val" type="number" step="0.01" min="0.01" placeholder="0,00">
          <div class="form-erro" id="inv-err">Informe o valor</div></div>
      </div>
      <div class="form-grupo"><label>Descrição</label>
        <input id="inv-desc" type="text" placeholder="Ex: Poupança, Tesouro Direto..." value="Investimento">
      </div>`, { onOk: () => {
        const valor = parseFloat(document.getElementById('inv-val').value) || 0;
        if (!valor) { document.getElementById('inv-err').classList.add('vis'); return; }
        const arr = Storage.investimentos();
        arr.push({ id: Utils.uuid(), data: document.getElementById('inv-data').value || Utils.dataHoje(),
          descricao: document.getElementById('inv-desc').value.trim() || 'Investimento', valor });
        Storage.salvarInvestimentos(arr);
        Modal.fechar(); this.render(); toast('Investimento registrado!');
    }});
  },
  _excluir(id) {
    Modal.confirmar('Excluir este investimento?', () => {
      Storage.salvarInvestimentos(Storage.investimentos().filter(i=>i.id!==id));
      this.render(); toast('Excluído.');
    });
  }
};

          <li>Use o botão <strong>＋</strong> para adicionar lançamentos rapidamente.</li>

          <li>Faça <strong>backup</strong> regularmente para não perder seus dados.</li>

      <div style="text-align:center;font-size:11px;color:var(--txt2);padding:10px">
        Controle Financeiro Offline v1.0 • Dados salvos localmente
      </div>`;
  },
  salvarNotif() {
    const ativo = document.getElementById('notif-ativo')?.checked || false;
    const diasAntes = parseInt(document.getElementById('notif-dias')?.value) || 3;
    Storage.salvarNotifConfig({ ativo, diasAntes });
    if (ativo) pedirPermissaoNotif().then(ok => {
      if (!ok) Utils.toast('Permissão de notificação negada pelo navegador.');
      else { Utils.toast('Notificações ativadas!'); verificarVencimentos(); }
    });
    else Utils.toast('Notificações desativadas.');
  },
  testarNotif() {
    pedirPermissaoNotif().then(ok => {
      if (!ok) { Utils.toast('Permissão negada — habilite notificações no navegador.'); return; }
      new Notification('🔔 Teste de notificação', {
        body: 'Fatura CartãoX vence em 2 dias — R$ 350,00',
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💳</text></svg>'
      });
      Utils.toast('Notificação de teste enviada!');
    });
  },
  salvarMetas() {
    const inputs = document.querySelectorAll('#metas-cat-lista input[data-cat-id]');
    const metas = {};
    inputs.forEach(inp => {
      const val = parseFloat(inp.value);
      if (!isNaN(val) && val > 0) metas[inp.dataset.catId] = val;
    });
    Storage.salvarMetas(metas);
    Utils.toast('Metas salvas!');
    if (Router.atual === 'dashboard') Telas.dashboard.render();
  },
  salvarChaveIA() {
    const val = (document.getElementById('ia-key-input')?.value || '').trim();
    if (!val) { Utils.toast('Digite a chave antes de salvar.'); return; }
    if (!val.startsWith('sk-ant-')) { Utils.toast('Chave inválida — deve começar com sk-ant-'); return; }
    localStorage.setItem('anthropic_key', val);
    Utils.toast('✅ Chave salva! O assistente já usa IA.');
  },
  removerChaveIA() {
    localStorage.removeItem('anthropic_key');
    const el = document.getElementById('ia-key-input');
    if (el) el.value = '';
    Utils.toast('Chave removida. Chat voltou ao modo básico.');
  },
  zerarERestaurar() {
    Modal.confirmar('Apagar TUDO e recarregar com os dados padrão?', () => {
      Object.keys(localStorage).filter(k => k.startsWith('ff_')).forEach(k => localStorage.removeItem(k));
      setTimeout(() => location.reload(), 200);
    });
  },
  exportar() {
    const dados = Storage.exportar();
    const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = `financas_backup_${Utils.dataHoje()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Backup exportado!');
  },
  importar(input) {
    const f = input.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const dados = JSON.parse(e.target.result);
        Modal.confirmar(`Isso substituirá TODOS os dados atuais. Continuar?`, () => {
          Storage.importar(dados);
          setTimeout(() => location.reload(), 400);
          toast(`Importado com sucesso! Recarregando...`, 1500);
        });
      } catch { toast('Arquivo inválido.'); }
    };
    reader.readAsText(f);
    input.value = '';
  },
  novaCat(tipo) {
    Modal.abrir('Nova Categoria', `

      </div>`,
      { onOk: () => this._salvarCat(tipo) });
  },
  _selCor(el) {
    document.querySelectorAll('#modal-corpo .cor-swatch').forEach(e=>e.classList.remove('sel'));
    el.classList.add('sel');
  },
  _salvarCat(tipo) {
    const nome = document.getElementById('nc-nome').value.trim();
    if (!nome) { document.getElementById('nc-err').classList.add('vis'); return; }
    const cor = document.querySelector('#modal-corpo .cor-swatch.sel')?.dataset.cor || CORES[0];
    const ico = document.getElementById('nc-ico').value.trim() || '📦';
    const arr = Storage.categorias();
    arr.push({ id: Utils.uuid(), nome, ico, cor, tipo });
    Storage.salvarCategorias(arr);
    Modal.fechar(); this.render(); toast('Categoria criada!');
  },
  excluirCat(id) {
    Modal.confirmar('Excluir esta categoria?', () => {
      Storage.salvarCategorias(Storage.categorias().filter(c=>c.id!==id));
      this.render(); toast('Categoria excluída.');
    });
  },
  novoFixo(tipo) { this._formFixo(null, tipo); },
  editarFixo(id) {
    const f = Storage.fixos().find(x=>x.id===id);
    if (!f) return;
    const arr = Storage.fixos();
    const idx = arr.findIndex(x=>x.id===id);
    arr[idx].ativo = !arr[idx].ativo;
    Storage.salvarFixos(arr);
    this.render(); toast(arr[idx].ativo ? 'Ativado!' : 'Pausado!');
  },
  _formFixo(id, tipoDefault) {
    const f = id ? Storage.fixos().find(x=>x.id===id) : null;
    const tipoAtual = f?.tipo || tipoDefault || 'despesa';
    const isReceita = tipoAtual === 'receita';
    const cats = Storage.categorias().filter(c => isReceita ? c.tipo !== 'despesa' : c.tipo !== 'receita');
    const catOpts = cats.map(c=>`<option value="${c.id}"${f?.categoria===c.id?' selected':''}>${c.ico} ${Utils.esc(c.nome)}</option>`).join('');
    const contaOpts = [`<option value="">Nenhuma</option>`,
      ...Storage.contas().map(c=>`<option value="${c.id}"${f?.contaId===c.id?' selected':''}>${Utils.esc(c.nome)}</option>`)].join('');
    const cartaoOpts = [`<option value="">Nenhum</option>`,
      ...Storage.cartoes().map(c=>`<option value="${c.id}"${f?.cartaoId===c.id?' selected':''}>${Utils.esc(c.nome)}</option>`)].join('');
    Modal.abrir(isReceita ? 'Receita Fixa Mensal' : 'Gasto Fixo Mensal', `
      <div class="form-grupo"><label>Descrição</label>
        <input id="gf-desc" type="text" placeholder="Ex: Aluguel" value="${Utils.esc(f?.descricao||'')}">
        <div class="form-erro" id="gf-err">Informe a descrição</div></div>
      <div class="form-row">
        <div class="form-grupo"><label>Valor (R$)</label>
          <input id="gf-val" type="number" step="0.01" placeholder="0,00" value="${f?.valor||''}"></div>
        <div class="form-grupo"><label>Todo dia</label>
          <input id="gf-dia" type="number" min="1" max="28" placeholder="Ex: 5" value="${f?.dia||''}"></div>
      </div>
      <div class="form-grupo"><label>Categoria</label><select id="gf-cat">${catOpts}</select></div>
      <div class="form-grupo"><label>Conta (opcional)</label><select id="gf-conta">${contaOpts}</select></div>
      <div class="form-grupo"><label>Cartão (opcional)</label><select id="gf-cartao">${cartaoOpts}</select></div>`,
      { onOk: () => {
        const desc = document.getElementById('gf-desc').value.trim();
        if (!desc) { document.getElementById('gf-err').classList.add('vis'); return; }
        const obj = {
          id: id || Utils.uuid(), descricao: desc,
          valor: parseFloat(document.getElementById('gf-val').value) || 0,
          dia: parseInt(document.getElementById('gf-dia').value) || 1,
          tipo: tipoAtual,
          categoria: document.getElementById('gf-cat').value,
          contaId: document.getElementById('gf-conta').value || null,
          cartaoId: document.getElementById('gf-cartao').value || null,
          ativo: true
        };
        const arr = Storage.fixos();
        if (id) { arr[arr.findIndex(x=>x.id===id)] = obj; } else arr.push(obj);
        Storage.salvarFixos(arr);
        Modal.fechar(); this.render(); toast(id?'Gasto fixo atualizado!':'Gasto fixo criado!');
    }});
  },
  excluirFixo(id) {
    Modal.confirmar('Excluir este gasto fixo?', () => {
      Storage.salvarFixos(Storage.fixos().filter(f=>f.id!==id));
      this.render(); toast('Excluído.');
    });
  }
};

            <div><label>Tipo</label>
              <select id="if-tipo-${f.id}">
                <option value="despesa" ${f.tipo==='despesa'?'selected':''}>🔴 Despesa</option>
                <option value="receita" ${f.tipo==='receita'?'selected':''}>🟢 Receita</option>

            </div>
          </div>
          <div class="ajuste-form-btns">
            <button onclick="Telas.ajuste.salvarFixo('${f.id}')">✅ Salvar</button>

      <div class="ajuste-section">
        <div class="ajuste-section-title">🎯 Meta de Investimento Mensal</div>

            <div class="ajuste-form-btns">

      </div>

        <div class="ajuste-section-title">🔁 Recorrentes (Fixos)</div>
        <button class="btn-novo-fixo" onclick="Telas.ajuste.novoFixo()">＋ Adicionar Novo Recorrente</button>
        ${fixosHtml}

  },

  _abrirForm(tipo, id) {
    document.querySelectorAll('.ajuste-inline-form').forEach(f => f.style.display = 'none');
    const form = document.getElementById(`form-${tipo}-${id}`);
    if (form) { form.style.display = 'block'; form.querySelector('input')?.focus(); }
  },
  _fecharForm(tipo, id) {
    const form = document.getElementById(`form-${tipo}-${id}`);
    if (form) form.style.display = 'none';
  },

  salvarConta(id) {
    const novoSaldo = parseFloat(document.getElementById(`input-conta-${id}`).value);
    if (isNaN(novoSaldo)) { toast('Valor inválido.'); return; }
    const contas = Storage.contas();
    const conta = contas.find(c => c.id === id);
    if (!conta) return;
    conta.saldoInicial = (conta.saldoInicial||0) + (novoSaldo - Fin.saldoConta(id));
    Storage.salvarContas(contas);
    toast(`Saldo de ${conta.nome} corrigido para ${Utils.moeda(novoSaldo)}.`);
    this.render();
  },

  salvarCartao(id) {
    const novoLimite = parseFloat(document.getElementById(`input-cartao-${id}`).value);
    if (isNaN(novoLimite) || novoLimite <= 0) { toast('Valor inválido.'); return; }
    const cartoes = Storage.cartoes();
    const cartao = cartoes.find(c => c.id === id);
    if (!cartao) return;
    cartao.limite = novoLimite;
    Storage.salvarCartoes(cartoes);
    toast(`Limite de ${cartao.nome} atualizado para ${Utils.moeda(novoLimite)}.`);
    this.render();
  },

  toggleFixo(id) {
    const fixos = Storage.fixos();
    const f = fixos.find(x => x.id === id);
    if (!f) return;
    f.ativo = !f.ativo;
    Storage.salvarFixos(fixos);
    toast(f.ativo ? `"${f.descricao}" reativado.` : `"${f.descricao}" pausado.`);
    this.render();
  },

  salvarFixo(id) {
    const desc = document.getElementById(`if-desc-${id}`).value.trim();
    const val  = parseFloat(document.getElementById(`if-val-${id}`).value);
    const dia  = parseInt(document.getElementById(`if-dia-${id}`).value);
    const tipo = document.getElementById(`if-tipo-${id}`).value;
    if (!desc || isNaN(val) || isNaN(dia) || dia < 1 || dia > 31) { toast('Preencha todos os campos corretamente.'); return; }
    const fixos = Storage.fixos();
    const f = fixos.find(x => x.id === id);
    if (!f) return;
    Object.assign(f, { descricao: desc, valor: val, dia, tipo });
    Storage.salvarFixos(fixos);
    toast(`"${desc}" atualizado.`);
    this.render();
  },

  excluirFixo(id) {
    Modal.confirmar('Excluir este recorrente permanentemente?', () => {
      Storage.salvarFixos(Storage.fixos().filter(f => f.id !== id));
      toast('Recorrente excluído.'); this.render();
    });
  },

  salvarMeta() {
    const v = parseFloat(document.getElementById('input-meta').value);
    if (isNaN(v) || v < 0) { toast('Valor inválido.'); return; }
    Storage.salvarMetaInvest(v);
    toast(`Meta atualizada para ${Utils.moeda(v)}/mês.`);
    this.render();
  },

  adicionarFatura(cartaoId) {
    document.querySelectorAll('.ajuste-inline-form').forEach(f => f.style.display='none');
    const form = document.getElementById(`form-fat-${cartaoId}`);
    if (form) { form.style.display='block'; form.querySelector('input')?.focus(); }
  },

  _salvarGastoFatura(cartaoId) {
    const desc  = document.getElementById(`fat-desc-${cartaoId}`).value.trim();
    const valor = parseFloat(document.getElementById(`fat-val-${cartaoId}`).value);
    const data  = document.getElementById(`fat-data-${cartaoId}`).value || Utils.dataHoje();
    if (!desc || isNaN(valor) || valor <= 0) { toast('Preencha descrição e valor.'); return; }
    const cartao = Storage.cartoes().find(c=>c.id===cartaoId);
    const txs = Storage.transacoes();
    txs.push({ id: Utils.uuid(), data, descricao: desc, valor, tipo: 'despesa',
      categoria: Storage.categorias().find(c=>c.nome==='Outros')?.id || null,
      contaId: null, cartaoId, contaDestinoId: null, parcelas:1, parcelaAtual:1, parcelaGrupoId:null });
    Storage.salvarTransacoes(txs);
    toast(`Gasto de ${Utils.moeda(valor)} adicionado à fatura ${cartao?.nome||''}.`);
    this.render();
  },

  novoFixo() {
    const contasOpts = Storage.contas().map(c=>`<option value="${c.id}">${c.nome}</option>`).join('');
    const cartoesOpts = Storage.cartoes().map(c=>`<option value="${c.id}">${c.nome}</option>`).join('');
    Modal.abrir('Novo Recorrente', `
      <div class="form-grupo"><label>Descrição</label><input id="nf-desc" placeholder="Ex: Netflix, Salário..."></div>
      <div class="form-row">
        <div class="form-grupo"><label>Valor (R$)</label><input type="number" step="0.01" id="nf-val" placeholder="0,00"></div>
        <div class="form-grupo"><label>Dia do mês</label><input type="number" min="1" max="31" id="nf-dia" placeholder="10"></div>
      </div>
      <div class="form-grupo"><label>Tipo</label>
        <select id="nf-tipo"><option value="despesa">🔴 Despesa</option><option value="receita">🟢 Receita</option></select>
      </div>
      <div class="form-grupo"><label>Conta (se debitado/creditado em conta)</label>
        <select id="nf-conta"><option value="">— nenhuma —</option>${contasOpts}</select>
      </div>
      <div class="form-grupo"><label>Cartão (se cobrado em cartão)</label>
        <select id="nf-cartao"><option value="">— nenhum —</option>${cartoesOpts}</select>
      </div>
      <button class="btn-primary" style="width:100%;margin-top:8px" onclick="Telas.ajuste._salvarNovoFixo()">✅ Adicionar</button>`);
  },

  _salvarNovoFixo() {
    const desc    = document.getElementById('nf-desc').value.trim();
    const val     = parseFloat(document.getElementById('nf-val').value);
    const dia     = parseInt(document.getElementById('nf-dia').value);
    const tipo    = document.getElementById('nf-tipo').value;
    const contaId = document.getElementById('nf-conta').value || null;
    const cartaoId= document.getElementById('nf-cartao').value || null;
    if (!desc || isNaN(val) || isNaN(dia) || dia < 1 || dia > 31) { toast('Preencha todos os campos.'); return; }
    const fixos = Storage.fixos();
    fixos.push({ id: Utils.uuid(), descricao: desc, valor: val, dia, tipo, contaId, cartaoId, categoria: null, ativo: true });
    Storage.salvarFixos(fixos);
    Modal.fechar();
    toast(`"${desc}" adicionado aos recorrentes.`);
    this.render();
  }
};

/* ═══════════════════════════════════════════════════════════
   FAB  (abre modal de novo lançamento)
═══════════════════════════════════════════════════════════ */
document.getElementById('fab').addEventListener('click', () => {
  const tela = Router.atual;
  if (tela === 'contas')        { Telas.contas.novo(); return; }
  if (tela === 'cartoes')       { Telas.cartoes.novo(); return; }
  if (tela === 'investimentos') { Telas.investimentos._novoManual(); return; }
  Telas.lancamentos.novo();
});

document.getElementById('modal-fechar').addEventListener('click', () => Modal.fechar());
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) Modal.fechar();
});

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
(async function() {
  Sync.init();
  const pulled = await Sync.pull();
  if (!pulled) seed();
  Chat.init();
  // Migração: atualiza meta de R$500 (padrão antigo) para R$900
  if (Storage.metaInvest() === 500) Storage.salvarMetaInvest(900);
  verificarRecompensa();
  verificarFixos();
  verificarVencimentos();
  Router.init();

  // Avisa se parece ser primeira abertura após atualização de arquivo
  const j = localStorage.getItem('ff_contas');
  const temDados = j && JSON.parse(j).length > 0;
  if (!temDados && !localStorage.getItem('ff_bem_vindo')) {
    localStorage.setItem('ff_bem_vindo', '1');
    setTimeout(() => {
      Modal.abrir('👋 Bem-vindo!', `
        <p style="font-size:14px;line-height:1.8;color:var(--txt2)">
          <strong style="color:var(--txt)">Parece que é sua primeira vez ou você baixou uma versão nova.</strong><br><br>
          Seus dados ficam salvos <strong>neste arquivo específico</strong>.<br>
          Ao baixar uma versão nova, os dados <strong>não são transferidos automaticamente</strong>.<br><br>
          <strong style="color:var(--aviso)">⚠️ Antes de baixar atualizações futuras:</strong><br>
          Vá em <strong>Config → Exportar JSON</strong> para salvar um backup.<br>
          Depois, no arquivo novo, use <strong>Config → Importar JSON</strong> para restaurar tudo.
        </p>
        <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-ghost" onclick="document.getElementById('imp-file-bv').click()">⬆️ Importar backup agora</button>
          <input type="file" id="imp-file-bv" accept=".json,.txt" style="display:none" onchange="Telas.config.importar(this);Modal.fechar()">
        </div>`, { footer: false });
    }, 600);
  }
})();
</script>
</body>
</html>
