<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Controle Financeiro</title>
<style>
:root {
  --prim: #6C63FF;
  --prim-dark: #5A52D5;
  --receita: #06D6A0;
  --despesa: #EF476F;
  --aviso: #FFD166;
  --fundo: #0F0F1A;
  --sup: #1A1A2E;
  --sup2: #252540;
  --borda: #2E2E50;
  --txt: #E9ECEF;
  --txt2: #9A9ABF;
  --sombra: 0 4px 16px rgba(0,0,0,0.4);
  --raio: 14px;
  --raio-sm: 8px;
  --fonte: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --nav-h: 64px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--fonte);
  background: var(--fundo);
  color: var(--txt);
  overflow-x: hidden;
}
#app { display: flex; flex-direction: column; height: 100vh; }

/* ── NAV ─────────────────────────────────────────────── */
#nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  height: var(--nav-h);
  background: var(--sup);
  border-top: 1px solid var(--borda);
  display: flex; align-items: stretch;
  box-shadow: 0 -4px 16px rgba(0,0,0,0.4);
}
#nav a {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  text-decoration: none; color: var(--txt2);
  font-size: 10px; font-weight: 500;
  transition: color .2s;
  padding: 6px 2px;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}
#nav a .nav-ico { font-size: 20px; line-height: 1; }
#nav a.ativo { color: var(--prim); }

/* ── MAIN CONTENT ──────────────────────────────────────── */
#conteudo {
  flex: 1; overflow-y: auto;
  padding: 16px 16px calc(var(--nav-h) + 16px);
  max-width: 900px; margin: 0 auto; width: 100%;
}

/* ── CARDS ────────────────────────────────────────────── */
.card {
  background: var(--sup);
  border: 1px solid var(--borda);
  border-radius: var(--raio);
  padding: 16px;
  box-shadow: var(--sombra);
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}
.card-resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 4px; }
.card-resumo .card {
  padding: 14px;
  border-left: 4px solid var(--prim);
}
.card-resumo .card.c-receita { border-left-color: var(--receita); }
.card-resumo .card.c-despesa { border-left-color: var(--despesa); }
.card-resumo .card.c-saldo   { border-left-color: var(--aviso); }
.card-label { font-size: 11px; color: var(--txt2); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.card-valor { font-size: 22px; font-weight: 700; }
.card-valor.pos { color: var(--receita); }
.card-valor.neg { color: var(--despesa); }

/* ── BARRA DE PROGRESSO ───────────────────────────────── */
.barra-wrap { background: var(--borda); border-radius: 99px; height: 8px; overflow: hidden; margin: 8px 0; }
.barra-fill { height: 100%; border-radius: 99px; transition: width .4s; }
.barra-ok   { background: var(--receita); }
.barra-med  { background: var(--aviso); }
.barra-alto { background: var(--despesa); }

/* ── BOTÕES ───────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; border-radius: var(--raio-sm); border: none;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: opacity .2s, transform .1s;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn-prim { background: var(--prim); color: #fff; }
.btn-prim:hover { background: var(--prim-dark); }
.btn-ghost { background: transparent; color: var(--txt2); border: 1px solid var(--borda); }
.btn-ghost:hover { color: var(--txt); border-color: var(--txt2); }
.btn-perig { background: var(--despesa); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-icon { width: 36px; height: 36px; padding: 0; border-radius: 50%; }

/* FAB */
#fab {
  position: fixed; bottom: calc(var(--nav-h) + 16px); right: 16px; z-index: 99;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--prim); color: #fff; font-size: 26px;
  border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(108,99,255,.5);
  display: flex; align-items: center; justify-content: center;
  transition: transform .2s, background .2s;
  -webkit-tap-highlight-color: transparent;
}
#fab:active { transform: scale(.92); }

/* ── MODAL ────────────────────────────────────────────── */
#modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
  align-items: center; justify-content: center; padding: 16px;
}
#modal-overlay.aberto { display: flex; }
#modal-box {
  background: var(--sup); border: 1px solid var(--borda);
  border-radius: var(--raio); width: 100%; max-width: 480px;
  max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,.6);
}
#modal-header {
  padding: 18px 20px 14px; border-bottom: 1px solid var(--borda);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
#modal-titulo { font-size: 17px; font-weight: 700; }
#modal-fechar {
  background: none; border: none; color: var(--txt2); font-size: 22px;
  cursor: pointer; line-height: 1; padding: 4px;
}
#modal-corpo { padding: 20px; overflow-y: auto; flex: 1; }
#modal-footer { padding: 14px 20px; border-top: 1px solid var(--borda); display: flex; gap: 10px; justify-content: flex-end; flex-shrink: 0; }

/* ── FORMS ────────────────────────────────────────────── */
.form-grupo { margin-bottom: 16px; }
.form-grupo label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--txt2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .4px;
}
.form-grupo input, .form-grupo select, .form-grupo textarea {
  width: 100%; padding: 10px 12px;
  background: var(--sup2); border: 1px solid var(--borda);
  border-radius: var(--raio-sm); color: var(--txt);
  font-family: var(--fonte); font-size: 14px;
  transition: border-color .2s;
  -webkit-appearance: none;
}
.form-grupo input:focus, .form-grupo select:focus, .form-grupo textarea:focus {
  outline: none; border-color: var(--prim);
}
.form-grupo select option { background: var(--sup2); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-erro { font-size: 11px; color: var(--despesa); margin-top: 4px; display: none; }
.form-erro.vis { display: block; }

/* ── LISTAS ───────────────────────────────────────────── */
.lista-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--borda);
}
.lista-item:last-child { border-bottom: none; }
.ico-cat {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.lista-info { flex: 1; min-width: 0; }
.lista-titulo { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lista-sub { font-size: 12px; color: var(--txt2); margin-top: 2px; }
.lista-valor { font-size: 15px; font-weight: 700; text-align: right; flex-shrink: 0; }
.lista-acoes { display: flex; gap: 6px; flex-shrink: 0; }

/* ── BADGES ───────────────────────────────────────────── */
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 99px;
  font-size: 11px; font-weight: 600;
}
.badge-corrente { background: rgba(108,99,255,.2); color: var(--prim); }
.badge-poupanca { background: rgba(6,214,160,.2); color: var(--receita); }
.badge-investimento { background: rgba(255,209,102,.2); color: var(--aviso); }
.badge-dinheiro { background: rgba(239,71,111,.2); color: var(--despesa); }

/* ── SEÇÃO HEADER ─────────────────────────────────────── */
.sec-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.sec-titulo { font-size: 20px; font-weight: 700; }

/* ── MÊS NAV ──────────────────────────────────────────── */
.mes-nav {
  display: flex; align-items: center; gap: 12px;
  background: var(--sup); border: 1px solid var(--borda);
  border-radius: var(--raio-sm); padding: 6px 10px;
  margin-bottom: 18px;
}
.mes-nav button {
  background: none; border: none; color: var(--txt2);
  font-size: 18px; cursor: pointer; padding: 2px 6px;
  border-radius: 6px; transition: background .15s;
}
.mes-nav button:hover { background: var(--sup2); }
.mes-nome { flex: 1; text-align: center; font-weight: 600; font-size: 14px; }

/* ── TABS ─────────────────────────────────────────────── */
.tabs { display: flex; gap: 4px; background: var(--sup2); border-radius: var(--raio-sm); padding: 4px; margin-bottom: 18px; }
.tab-btn {
  flex: 1; padding: 8px 4px; border: none; border-radius: 6px;
  background: transparent; color: var(--txt2);
  font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s;
}
.tab-btn.ativo { background: var(--prim); color: #fff; }

/* ── FILTROS ──────────────────────────────────────────── */
.filtros-wrap {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-bottom: 14px;
}
.filtros-wrap select, .filtros-wrap input {
  flex: 1; min-width: 100px;
  padding: 8px 10px;
  background: var(--sup); border: 1px solid var(--borda);
  border-radius: var(--raio-sm); color: var(--txt);
  font-family: var(--fonte); font-size: 13px;
  -webkit-appearance: none;
}
.filtros-wrap select:focus, .filtros-wrap input:focus { outline: none; border-color: var(--prim); }

/* ── EMPTY STATE ──────────────────────────────────────── */
.vazio {
  text-align: center; padding: 40px 20px; color: var(--txt2);
}
.vazio .vazio-ico { font-size: 48px; margin-bottom: 12px; }
.vazio p { font-size: 14px; }

/* ── TOAST ────────────────────────────────────────────── */
#toast {
  position: fixed; bottom: calc(var(--nav-h) + 74px); left: 50%; transform: translateX(-50%);
  background: var(--sup2); color: var(--txt); border: 1px solid var(--borda);
  border-radius: var(--raio-sm); padding: 10px 20px; font-size: 13px; font-weight: 600;
  z-index: 300; pointer-events: none;
  opacity: 0; transition: opacity .25s;
  white-space: nowrap;
}
#toast.vis { opacity: 1; }

/* ── TELA ESCONDIDA ───────────────────────────────────── */
.tela { display: none; }
.tela.ativa { display: block; }

/* ── SEPARADOR DATA ───────────────────────────────────── */
.sep-data {
  font-size: 11px; font-weight: 700; color: var(--txt2);
  text-transform: uppercase; letter-spacing: .5px;
  padding: 10px 0 6px; margin-top: 4px;
}

/* ── CHIP CATEGORIA ───────────────────────────────────── */
.chip-cat {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 99px;
  font-size: 11px; font-weight: 600;
  background: rgba(108,99,255,.15); color: var(--prim);
}

/* ── CORES CARTÃO ─────────────────────────────────────── */
.card-conta { border-top: 4px solid var(--prim); }

/* ── TIPO BADGE ───────────────────────────────────────── */
.tipo-pill {
  display: inline-flex; gap: 4px;
}
.tipo-pill button {
  flex: 1; padding: 8px; border: 2px solid var(--borda); border-radius: var(--raio-sm);
  background: transparent; color: var(--txt2); font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all .2s; white-space: nowrap;
}
.tipo-pill button.sel-despesa  { border-color: var(--despesa);  background: rgba(239,71,111,.15);  color: var(--despesa);  }
.tipo-pill button.sel-receita  { border-color: var(--receita);  background: rgba(6,214,160,.15);   color: var(--receita);  }
.tipo-pill button.sel-transf   { border-color: var(--prim);     background: rgba(108,99,255,.15);  color: var(--prim);     }
.tipo-pill button.sel-fatura   { border-color: var(--aviso);    background: rgba(255,209,102,.15); color: var(--aviso);    }

/* ── COR SWATCH ───────────────────────────────────────── */
.cor-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.cor-swatch {
  width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
  border: 3px solid transparent; transition: border-color .15s;
}
.cor-swatch.sel { border-color: #fff; }

/* ── CATEGORIA PICKER ─────────────────────────────────── */
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px,1fr)); gap: 8px; }
.cat-opcao {
  padding: 8px 4px; border-radius: var(--raio-sm);
  border: 2px solid var(--borda); background: var(--sup2);
  text-align: center; cursor: pointer; transition: all .15s;
  font-size: 11px; font-weight: 600; color: var(--txt2);
}
.cat-opcao:hover { border-color: var(--prim); color: var(--prim); }
.cat-opcao.sel { border-color: var(--prim); background: rgba(108,99,255,.15); color: var(--prim); }
.cat-opcao .cat-ico { font-size: 20px; display: block; margin-bottom: 4px; }

/* ── PARCELAS PREVIEW ─────────────────────────────────── */
.parcela-info {
  font-size: 12px; color: var(--txt2); margin-top: 6px;
  padding: 8px; background: var(--sup2); border-radius: var(--raio-sm);
}

/* ── CANVAS CHART ─────────────────────────────────────── */
.chart-wrap { position: relative; margin: 16px 0; }
canvas { display: block; }

/* ── RELATORIO LINHA ──────────────────────────────────── */
.rel-linha {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--borda);
}
.rel-linha:last-child { border-bottom: none; }
.rel-barra-wrap { flex: 1; background: var(--borda); height: 6px; border-radius: 99px; overflow: hidden; }
.rel-barra { height: 100%; border-radius: 99px; }
.rel-nome { width: 130px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rel-val { width: 90px; text-align: right; font-size: 13px; font-weight: 700; }
.rel-pct { width: 38px; text-align: right; font-size: 11px; color: var(--txt2); }

/* ── CHAT ─────────────────────────────────────────────── */
.chat-wrap { margin-bottom: 18px; }
.chat-input-row {
  display: flex; gap: 8px; align-items: flex-end;
  background: var(--sup); border: 1px solid var(--borda);
  border-radius: var(--raio); padding: 10px 12px;
}
.chat-input-row textarea {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--txt); font-family: var(--fonte); font-size: 14px;
  resize: none; line-height: 1.5; max-height: 80px;
  min-height: 22px;
}
.chat-input-row textarea::placeholder { color: var(--txt2); }
.chat-send {
  background: var(--prim); border: none; color: #fff;
  width: 38px; height: 38px; border-radius: 50%; font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background .2s;
}
.chat-send:hover { background: var(--prim-dark); }
.chat-historico { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.chat-msg {
  max-width: 85%; padding: 9px 13px; border-radius: 14px; font-size: 13px; line-height: 1.5;
}
.chat-msg.user { align-self: flex-end; background: var(--prim); color: #fff; border-bottom-right-radius: 4px; }
.chat-msg.app  { align-self: flex-start; background: var(--sup2); color: var(--txt); border-bottom-left-radius: 4px; }
.chat-msg.app.ok  { border-left: 3px solid var(--receita); }
.chat-msg.app.err { border-left: 3px solid var(--despesa); }

/* ── ALERTA INVESTIMENTO ──────────────────────────────── */
.alerta-invest {
  border-radius: var(--raio-sm); padding: 12px 14px; margin-bottom: 14px;
  font-size: 13px; line-height: 1.6; border-left: 4px solid;
}
.alerta-invest.ok    { background: rgba(6,214,160,.1);  border-color: var(--receita); color: var(--receita); }
.alerta-invest.medio { background: rgba(255,209,102,.1);border-color: var(--aviso);   color: var(--aviso); }
.alerta-invest.critico{ background: rgba(239,71,111,.1); border-color: var(--despesa); color: var(--despesa); }

/* Fatura overlay */
#fatura-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.78); z-index: 150;
  align-items: center; justify-content: center; padding: 16px;
}
#fatura-overlay.aberto { display: flex; }
#fatura-panel {
  background: var(--sup); border-radius: 16px;
  width: min(95vw, 700px); max-height: 88vh;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}
#fatura-panel-header {
  padding: 16px 20px; border-bottom: 1px solid var(--borda);
  display: flex; justify-content: space-between; align-items: flex-start; flex-shrink: 0;
}
#fatura-panel-corpo { overflow-y: auto; flex: 1; }

/* ── INVEST PROGRESS ──────────────────────────────────── */
.invest-progress { margin: 16px 0; }
.invest-nums { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }

/* ── TABLET: sidebar esquerda (≥768px) ─────────────────── */
@media (min-width: 768px) {
  #nav {
    position: fixed;
    top: 0; left: 0; bottom: 0; right: auto;
    width: 160px; height: 100vh;
    flex-direction: column;
    justify-content: flex-start;
    align-items: stretch;
    border-top: none;
    border-right: 1px solid var(--borda);
    box-shadow: 4px 0 20px rgba(0,0,0,0.35);
    padding: 24px 0 12px;
    overflow-y: auto;
  }
  #nav a {
    flex: none;
    flex-direction: row;
    justify-content: flex-start;
    gap: 12px;
    padding: 14px 20px;
    font-size: 13px;
    border-radius: 0;
    border-left: 3px solid transparent;
  }
  #nav a.ativo { border-left-color: var(--prim); background: rgba(108,99,255,0.08); }
  #nav a .nav-ico { font-size: 20px; }
  #nav a span:not(.nav-ico) { display: block; }
  .sync-wrap { margin-top: auto; padding: 16px 0 4px; border-top: 1px solid var(--borda); }
  #conteudo { margin-left: 160px; padding: 28px 32px 32px; }
  #fab { bottom: 28px; right: 28px; }
  #toast { bottom: 28px; left: 50%; transform: translateX(-50%); }
  .card-resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 4px; }
}

/* ── DESKTOP: tela grande (≥1200px) ────────────────────── */
@media (min-width: 1200px) {
  #nav { width: 200px; padding: 28px 0 14px; }
  #nav a { padding: 13px 22px; font-size: 13px; gap: 12px; }
  #conteudo { margin-left: 200px; padding: 28px 36px 36px; max-width: 960px; }
  #modal-box { max-width: 520px; }
}

/* ── IPHONE / MOBILE: barra inferior (≤767px) ───────────── */
@media (max-width: 767px) {
  #nav a span:not(.nav-ico) { display: none; }
  .form-row { grid-template-columns: 1fr; }
}
.ajuste-section { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.ajuste-section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }
.ajuste-item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--borda); flex-wrap: wrap; }
.ajuste-item:last-of-type { border-bottom: none; }
.ajuste-item-inativo { opacity: 0.5; }
.ajuste-item-info { flex: 1; min-width: 120px; }
.ajuste-item-nome { font-weight: 600; font-size: 15px; }
.ajuste-item-detalhe { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.ajuste-item-valor { font-weight: 700; font-size: 16px; min-width: 90px; text-align: right; }
.btn-ajuste { background: var(--card-hover); border: 1px solid var(--borda); color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn-ajuste:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-del { background: rgba(239,71,111,0.12) !important; border-color: rgba(239,71,111,0.4) !important; color: #ef476f !important; }
.btn-del:hover { background: #ef476f !important; color: #fff !important; }
.btn-toggle { padding: 6px 14px; border-radius: 20px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
.toggle-ativo { background: rgba(6,214,160,0.18); color: #06D6A0; }
.toggle-inativo { background: rgba(239,71,111,0.12); color: #ef476f; }
.ajuste-inline-form { background: var(--fundo); border: 1px solid var(--accent); border-radius: 10px; padding: 16px; margin: 8px 0 12px; }
.ajuste-inline-form label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; margin-top: 8px; }
.ajuste-inline-form label:first-child { margin-top: 0; }
.ajuste-inline-form input, .ajuste-inline-form select { width: 100%; background: var(--card-bg); border: 1px solid var(--borda); color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 15px; box-sizing: border-box; }

/* ═══════════════════════════════════════════════════════════
   STORAGE
═══════════════════════════════════════════════════════════ */
const Storage = {
  _k: k => 'ff_' + k,
  get(k) { try { return JSON.parse(localStorage.getItem(this._k(k))) ?? null; } catch { return null; } },
  set(k, v) { localStorage.setItem(this._k(k), JSON.stringify(v)); },
  contas()       { return this.get('contas')      || []; },
  cartoes()      { return this.get('cartoes')     || []; },
  transacoes()   { return this.get('transacoes')  || []; },
  categorias()   { return this.get('categorias')  || []; },
  config()       { return this.get('config')      || { temaEscuro: false }; },
  salvarContas(v)      { this.set('contas', v);      },
  salvarCartoes(v)     { this.set('cartoes', v);     },
  salvarTransacoes(v)  { this.set('transacoes', v);  },
  salvarCategorias(v)  { this.set('categorias', v);  },
  salvarConfig(v)      { this.set('config', v);      },
  investimentos()      { return this.get('investimentos') || []; },
  salvarInvestimentos(v){ this.set('investimentos', v); },
  fixos()              { return this.get('fixos') || []; },
  salvarFixos(v)       { this.set('fixos', v); },
  fixosLog()           { return this.get('fixoslog') || []; },
  salvarFixosLog(v)    { this.set('fixoslog', v); },
  metaInvest()         { return this.get('metainvest') ?? 500; },
  salvarMetaInvest(v)  { this.set('metainvest', v); },
  recompensas()        { return this.get('recompensas') || []; },
  salvarRecompensas(v) { this.set('recompensas', v); },
  notifConfig()        { return this.get('notifcfg') || { ativo: false, diasAntes: 3 }; },
  salvarNotifConfig(v) { this.set('notifcfg', v); },
  metas()              { return this.get('metas') || {}; },
  salvarMetas(v)       { this.set('metas', v); },
  chatHistorico()      { return this.get('chathist') || []; },
  salvarChatHistorico(v){ this.set('chathist', v); },
  exportar() {
    return { contas: this.contas(), cartoes: this.cartoes(), transacoes: this.transacoes(),
             categorias: this.categorias(), config: this.config(), investimentos: this.investimentos(),
             fixos: this.fixos(), metaInvest: this.metaInvest(), exportadoEm: new Date().toISOString() };
  },
  importar(obj) {
    if (!obj.contas || !obj.cartoes || !obj.transacoes || !obj.categorias) throw new Error('Arquivo inválido');
    this.salvarContas(obj.contas); this.salvarCartoes(obj.cartoes);
    this.salvarTransacoes(obj.transacoes); this.salvarCategorias(obj.categorias);
    if (obj.config) this.salvarConfig(obj.config);
    if (obj.investimentos) this.salvarInvestimentos(obj.investimentos);
    if (obj.fixos) this.salvarFixos(obj.fixos);
    if (obj.metaInvest != null) this.salvarMetaInvest(obj.metaInvest);

};

/* ═══════════════════════════════════════════════════════════
   SYNC (Firebase Firestore — auto-sync entre dispositivos)
═══════════════════════════════════════════════════════════ */
const Sync = (function() {
  let _db = null, _timer = null, _pulling = false;

  function _doc() { return _db && _db.collection('financas').doc('dados'); }

  function _setStatus(s) {
    const el = document.getElementById('sync-dot');
    if (!el) return;
    const icons = { idle:'🟡', syncing:'🔵', synced:'🟢', error:'🔴', offline:'⚫' };
    const tips  = { idle:'Sync pendente', syncing:'Sincronizando…', synced:'Sincronizado ✓', error:'Erro de sync', offline:'Sem conexão' };
    el.textContent = icons[s] || '🟡';
    el.title = tips[s] || '';
  }

  return {
    init() {
      if (typeof firebase === 'undefined') { _setStatus('offline'); return; }
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp({
            apiKey: "AIzaSyBGEQE5UJS9pMfu83nSURIYQe4dLDWmacA",
            authDomain: "financas-pessoal-1ca66.firebaseapp.com",
            projectId: "financas-pessoal-1ca66",
            storageBucket: "financas-pessoal-1ca66.firebasestorage.app",
            messagingSenderId: "345420883651",
            appId: "1:345420883651:web:31a0e381ab462678db6476"
          });
        }
        _db = firebase.firestore();
        _db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
      } catch(e) { console.warn('Firebase init:', e); }
      window.addEventListener('online',  () => { _setStatus('idle'); this.push(); });
      window.addEventListener('offline', () => _setStatus('offline'));
      if (!navigator.onLine) _setStatus('offline');
    },

    push() {
      if (!_db || _pulling) return;
      clearTimeout(_timer);
      _timer = setTimeout(async () => {
        _setStatus('syncing');
        try {
          await _doc().set({
            contas: Storage.contas(),
            cartoes: Storage.cartoes(),
            transacoes: Storage.transacoes(),
            categorias: Storage.categorias(),
            fixos: Storage.fixos(),
            fixosLog: Storage.fixosLog(),
            investimentos: Storage.investimentos(),
            metaInvest: Storage.metaInvest(),
            recompensas: Storage.recompensas(),
            versao: localStorage.getItem('ff_versao') || '',
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          _setStatus('synced');
        } catch(e) {
          console.warn('Sync push:', e);
          _setStatus(navigator.onLine ? 'error' : 'offline');
        }
      }, 1500);
    },

    async pull() {
      if (!_db) return false;
      _setStatus('syncing');
      try {
        const snap = await _doc().get();
        if (!snap.exists || !snap.data().contas) { _setStatus('idle'); return false; }
        const d = snap.data();
        _pulling = true;
        if (d.contas)            Storage.salvarContas(d.contas);
        if (d.cartoes)           Storage.salvarCartoes(d.cartoes);
        if (d.transacoes)        Storage.salvarTransacoes(d.transacoes);
        if (d.categorias)        Storage.salvarCategorias(d.categorias);
        if (d.fixos)             Storage.salvarFixos(d.fixos);
        if (d.fixosLog)          Storage.salvarFixosLog(d.fixosLog);
        if (d.investimentos)     Storage.salvarInvestimentos(d.investimentos);
        if (d.metaInvest != null) Storage.salvarMetaInvest(d.metaInvest);
        if (d.recompensas)       Storage.salvarRecompensas(d.recompensas);
        if (d.versao)            localStorage.setItem('ff_versao', d.versao);
        _pulling = false;
        _setStatus('synced');
        return true;
      } catch(e) {
        _pulling = false;
        console.warn('Sync pull:', e);
        _setStatus(navigator.onLine ? 'error' : 'offline');
        return false;
      }
    }
  };
})();

// Patch Storage: todo salvar* também envia para Firestore
['salvarContas','salvarCartoes','salvarTransacoes','salvarCategorias',
 'salvarFixos','salvarFixosLog','salvarInvestimentos','salvarMetaInvest','salvarRecompensas'
].forEach(fn => {
  const orig = Storage[fn].bind(Storage);
  Storage[fn] = function(...args) { orig(...args); Sync.push(); };
});

const Utils = {
  uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  },
  moeda(v) {
    return (v ?? 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  },
  moedaSimples(v) {
    return Math.abs(v ?? 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  },
  parseMoeda(s) {
    if (typeof s === 'number') return s;
    return parseFloat(String(s).replace(/\./g, '').replace(',', '.')) || 0;
  },
  dataHoje() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  },
  formatarData(iso) {
    if (!iso) return '';
    const [a,m,d] = iso.split('-');
    return `${d}/${m}/${a}`;
  },
  nomeMes(m, a) {
    return new Date(a, m-1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  },
  primeiroDia(m, a) { return new Date(a, m-1, 1); },
  ultimoDia(m, a)   { return new Date(a, m, 0); },
  datasNoMes(iso, m, a) {
    const d = new Date(iso + 'T00:00:00');
    return d >= this.primeiroDia(m, a) && d <= this.ultimoDia(m, a);
  },
  mesAtual() {
    const d = new Date();
    return { mes: d.getMonth() + 1, ano: d.getFullYear() };
  },
  addMes(m, a, delta) {
    let nm = m + delta, na = a;
    while (nm > 12) { nm -= 12; na++; }
    while (nm < 1)  { nm += 12; na--; }
    return { mes: nm, ano: na };
  },
  corTexto(hex) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return (r*299 + g*587 + b*114) / 1000 > 128 ? '#000' : '#fff';
  },
  esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
};

   AUTO-FIXOS  (insere gastos fixos no dia certo)
═══════════════════════════════════════════════════════════ */
function verificarRecompensa() {
  const hoje = new Date();
  if (hoje.getDate() < 2) return; // too early in month
  const ant = Utils.addMes(hoje.getMonth()+1, hoje.getFullYear(), -1);
  const mesAno = `${ant.mes}-${ant.ano}`;
  const recs = Storage.recompensas();
  if (recs.some(r => r.mesAno === mesAno)) return; // already recorded
  const orc = Fin.orcamento5030(ant.mes, ant.ano);
  if (orc.receita === 0) return; // no data
  const ok = orc.essencial.ok && orc.investimento.ok && orc.lazer.ok;
  recs.push({ mesAno, ok, gasto: { essencial: orc.essencial.gasto, investimento: orc.investimento.gasto, lazer: orc.lazer.gasto }, receita: orc.receita });
  Storage.salvarRecompensas(recs);
}

function verificarFixos() {
  const hoje = new Date();
  const diaHoje = hoje.getDate();
  const mesAno = `${hoje.getMonth()+1}-${hoje.getFullYear()}`;
  const log = Storage.fixosLog();
  const fixos = Storage.fixos();
  const txs = Storage.transacoes();
  let inseriu = false;
  for (const fixo of fixos) {
    if (!fixo.ativo) continue;
    if (diaHoje < fixo.dia) continue;
    if (log.some(l => l.fixoId === fixo.id && l.mesAno === mesAno)) continue;
    const dataStr = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-${String(fixo.dia).padStart(2,'0')}`;
    txs.push({ id: Utils.uuid(), data: dataStr, descricao: fixo.descricao, valor: fixo.valor,
      tipo: fixo.tipo || 'despesa', categoria: fixo.categoria, contaId: fixo.contaId || null,
      cartaoId: fixo.cartaoId || null, contaDestinoId: null, parcelas: 1, parcelaAtual: 1, parcelaGrupoId: null });
    log.push({ fixoId: fixo.id, mesAno });
    inseriu = true;
  }
  if (inseriu) { Storage.salvarTransacoes(txs); Storage.salvarFixosLog(log); }
}

/* ═══════════════════════════════════════════════════════════
   NOTIFICAÇÕES DE VENCIMENTO
═══════════════════════════════════════════════════════════ */
async function pedirPermissaoNotif() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  const result = await Notification.requestPermission();
  return result === 'granted';
}

function verificarVencimentos() {
  const cfg = Storage.notifConfig();
  if (!cfg.ativo) return;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const hoje = new Date();
  const mesAtual = hoje.getMonth() + 1;
  const anoAtual = hoje.getFullYear();
  const chaveEnvio = `ff_notif_sent_${anoAtual}-${String(mesAtual).padStart(2,'0')}`;
  const enviados = JSON.parse(localStorage.getItem(chaveEnvio) || '[]');
  const cartoes = Storage.cartoes();
  let novoEnvio = false;
  for (const cartao of cartoes) {
    const diaVenc = cartao.diaVencimento || 1;
    let dataVenc = new Date(anoAtual, mesAtual - 1, diaVenc);
    if (dataVenc < hoje) dataVenc = new Date(anoAtual, mesAtual, diaVenc);
    const diffMs = dataVenc - hoje;
    const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    if (days >= 0 && days <= cfg.diasAntes && !enviados.includes(cartao.id)) {
      const { fechado } = Fin._periodosFatura(cartao);
      const valor = Fin.faturaCartao(cartao.id, fechado.mes, fechado.ano);
      new Notification('Fatura vencendo!', {
        body: `Fatura ${cartao.nome} vence em ${days} dia${days!==1?'s':''} — ${Utils.moeda(valor)}`,
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💳</text></svg>'
      });
      enviados.push(cartao.id);
      novoEnvio = true;
    }
  }
  if (novoEnvio) localStorage.setItem(chaveEnvio, JSON.stringify(enviados));
}

  // ── IA: Claude API ────────────────────────────────────
  async _processarIA(txt, apiKey) {
    const chatEl = document.getElementById('chat-hist');
    const loadDiv = document.createElement('div');
    loadDiv.className = 'chat-msg app';
    loadDiv.style.opacity = '0.6';
    loadDiv.textContent = '⏳ Pensando…';
    if (chatEl) { chatEl.appendChild(loadDiv); chatEl.scrollTop = chatEl.scrollHeight; }

    try {
      // Monta histórico excluindo mensagem atual (já está no _hist)
      const msgs = this._hist
        .filter(h => h.cls !== 'loading')
        .slice(-14)
        .map(h => ({ role: h.de === 'user' ? 'user' : 'assistant', content: h.msg }));

      // Garante alternância e começo com user
      const merged = [];
      for (const m of msgs) {
        if (merged.length && merged[merged.length-1].role === m.role)
          merged[merged.length-1].content += '\n' + m.content;
        else merged.push({...m});
      }
      while (merged.length && merged[0].role !== 'user') merged.shift();
      if (!merged.length) merged.push({ role: 'user', content: txt });

      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'content-type': 'application/json',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1024,
          system: this._buildContexto(),
          messages: merged
        })
      });

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error?.message || `Erro HTTP ${resp.status}`);
      }

      const data = await resp.json();
      const content = data.content[0]?.text || '';

      let parsed = { resposta: content, acoes: [] };
      try {
        const clean = content.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
        const m = clean.match(/\{[\s\S]*\}/);
        if (m) {
          const candidate = JSON.parse(m[0]);
          if (candidate.resposta !== undefined || candidate.acoes !== undefined) parsed = candidate;
        }
      } catch(e) { console.warn('JSON parse:', e, content); }

      const executadas = parsed.acoes?.length ? this._executarAcoes(parsed.acoes) : 0;
      if (chatEl && loadDiv.parentNode) chatEl.removeChild(loadDiv);

      let msg = parsed.resposta || content;
      if (executadas > 0) msg += `\n✅ ${executadas} ação(ões) aplicada(s) no app.`;
      else if (parsed.acoes?.length === 0 && /adicion|altere|remov|registr/i.test(msg))
        msg += '\n⚠️ Nenhuma ação foi executada. Tente reformular o pedido.';
      this._addMsg('app', msg, 'ok');

    } catch(e) {
      if (chatEl && loadDiv.parentNode) chatEl.removeChild(loadDiv);
      this._addMsg('app', `❌ ${e.message}`, 'err');
    }
  },

  _executarAcoes(acoes) {
    let atualizou = false;
    let executadas = 0;
    const transArr = Storage.transacoes();

    for (const a of acoes) {
      const d = a.dados;

      if (a.tipo === 'transacao') {
        if (!d || !d.valor || parseFloat(d.valor) <= 0) continue;
        transArr.push({
          id: Utils.uuid(),
          data: d.data || Utils.dataHoje(),
          descricao: d.descricao || 'Lançamento via assistente',
          valor: parseFloat(d.valor),
          tipo: d.tipo || 'despesa',
          categoria: d.categoriaId || null,
          contaId: d.contaId || null,
          cartaoId: d.cartaoId || null,
          contaDestinoId: null,
          parcelas: 1, parcelaAtual: 1, parcelaGrupoId: null
        });
        atualizou = true; executadas++;

      } else if (a.tipo === 'atualizar_cartao') {
        const cartoes = Storage.cartoes();
        const c = cartoes.find(x => x.id === d.cartaoId);
        if (c) {
          if (d.limite != null) c.limite = parseFloat(d.limite);
          Storage.salvarCartoes(cartoes);
          atualizou = true; executadas++;
        }

      } else if (a.tipo === 'remover_transacao') {
        const transacoes = Storage.transacoes();
        let removidas = 0;
        if (d.transacaoId) {
          const idx = transacoes.findIndex(x => x.id === d.transacaoId);
          if (idx >= 0) { transacoes.splice(idx, 1); removidas++; }
        } else if (d.ultima) {
          const hoje = Utils.dataHoje();
          const idx = transacoes.map((t,i) => ({t,i}))
            .filter(({t}) => t.data <= hoje)
            .sort((a,b) => b.t.data.localeCompare(a.t.data) || b.i - a.i)
            .shift()?.i;
          if (idx != null) { transacoes.splice(idx, 1); removidas++; }
        }
        if (removidas) { Storage.salvarTransacoes(transacoes); atualizou = true; executadas++; }

      } else if (a.tipo === 'atualizar_conta') {
        const contas = Storage.contas();
        const c = contas.find(x => x.id === d.contaId);
        if (c && d.novoSaldo != null) {
          c.saldoInicial = (c.saldoInicial || 0) + (parseFloat(d.novoSaldo) - Fin.saldoConta(c.id));
          Storage.salvarContas(contas);
          atualizou = true; executadas++;
        }
      }
    }

    if (acoes.some(a => a.tipo === 'transacao')) Storage.salvarTransacoes(transArr);
    if (atualizou) {
      ['dashboard','lancamentos','cartoes','contas','ajuste'].forEach(t => {
        if (Router.atual === t) Telas[t === 'lancamentos' ? 'lancamentos' : t][t === 'lancamentos' ? '_renderLista' : 'render']();
      });
    }
    return executadas;
  },

  _buildContexto() {
    const hoje = Utils.dataHoje();
    const contas  = Storage.contas();
    const cartoes = Storage.cartoes();
    const cats    = Storage.categorias();

    const contasStr = contas.map(c =>
      `- ${c.nome}(${c.tipo}) saldo:${Utils.moeda(Fin.saldoConta(c.id))} id:${c.id}`
    ).join('\n');

  // ── Regex (fallback sem chave de API) ─────────────────
  _processarRegex(txt) {
    const t = txt.toLowerCase();

    if (/pagu|pagar|quero pagar|vou pagar/.test(t) && /fatura|cartão|cartao|nubank|inter|credito|crédito/.test(t)) {
      this._abrirPagarFatura(txt); return;
    }
    if (/investi|apliquei|guardei|poupei|poupi|coloquei na poupan|coloquei no invest/.test(t)) {
      const valor = this._extrairValor(t);
      if (!valor) { this._addMsg('app', '❓ Não entendi o valor. Ex: "investi 500 hoje"', 'err'); return; }
      const arr = Storage.investimentos();
      arr.push({ id: Utils.uuid(), data: Utils.dataHoje(), descricao: txt, valor });
      Storage.salvarInvestimentos(arr);
      const meta = Storage.metaInvest();
      const investMes = arr.filter(i => Utils.datasNoMes(i.data, Utils.mesAtual().mes, Utils.mesAtual().ano)).reduce((a,b)=>a+b.valor,0);
      const falta = Math.max(0, meta - investMes);
      const extra = falta === 0 ? ' 🎉 Meta atingida!' : ` Falta ${Utils.moeda(falta)} para a meta.`;
      this._addMsg('app', `✅ Investimento de ${Utils.moeda(valor)} registrado!${extra}`, 'ok');
      if (Router.atual === 'investimentos') Telas.investimentos.render();
      return;
    }

    const isReceita = /recebi|ganhei|entrou|entrada|pagaram|fui pago|depositaram/.test(t);
    const valor = this._extrairValor(t);
    if (!valor) { this._addMsg('app', '❓ Não entendi o valor. Tente: "gastei 50 no mercado" ou "recebi 1000 de salário"\n\n💡 Configure sua chave de IA em Config para falar naturalmente!', 'err'); return; }

    const tipo = isReceita ? 'receita' : 'despesa';
    const catNome = this._detectarCategoria(t);
    const cats = Storage.categorias();
    const cat = cats.find(c => c.nome === catNome) ||
                cats.find(c => c.tipo !== (isReceita ? 'despesa' : 'receita')) ||
                cats.find(c => c.nome === 'Outros') || cats[0];
    const contas  = Storage.contas();
    const cartoes = Storage.cartoes();
    const cartaoDetect = cartoes.find(c => t.includes(c.nome.toLowerCase()) ||
      c.nome.toLowerCase().split(' ').filter(w=>w.length>2).some(w => t.includes(w)));
    const contaDetect = !cartaoDetect ? contas.find(c => t.includes(c.nome.toLowerCase()) ||
      c.nome.toLowerCase().split(' ').filter(w=>w.length>2).some(w => t.includes(w))) : null;
    const cartaoId = cartaoDetect?.id || null;
    const contaId  = contaDetect?.id || (!cartaoDetect && contas.length === 1 ? contas[0].id : null);
    const data = this._extrairData(t);
    const arr = Storage.transacoes();
    arr.push({ id: Utils.uuid(), data, descricao: this._limparDesc(txt), valor, tipo,
      categoria: cat?.id || null, contaId, cartaoId, contaDestinoId: null,
      parcelas: 1, parcelaAtual: 1, parcelaGrupoId: null });
    Storage.salvarTransacoes(arr);
    const sinal = tipo === 'receita' ? '💰' : '💸';
    const ondeNome = cartaoDetect ? ` → cartão ${cartaoDetect.nome}` : contaId ? ` → ${contas.find(c=>c.id===contaId)?.nome}` : '';
    this._addMsg('app', `${sinal} ${tipo === 'receita'?'Receita':'Despesa'} de ${Utils.moeda(valor)} em ${cat?.ico||''} ${cat?.nome||'Outros'}${ondeNome} registrada!`, 'ok');
    if (Router.atual === 'dashboard') Telas.dashboard.render();
    if (Router.atual === 'lancamentos') Telas.lancamentos._renderLista();
  },

  _extrairValor(t) {
    const m = t.match(/r\$\s*([\d.,]+)/) ||
              t.match(/([\d]+(?:[.,]\d+)*)\s*(?:reais?|conto|mangos?)?/);
    if (!m) return null;
    let s = m[1];
    if (s.includes('.') && s.includes(',')) {
      s = s.replace(/\./g, '').replace(',', '.');
    } else if (s.includes(',')) {
      s = s.split(',')[1].length <= 2 ? s.replace(',', '.') : s.replace(',', '');
    } else if (s.includes('.')) {
      s = s.split('.').pop().length === 3 ? s.replace(/\./g, '') : s;
    }
    const v = parseFloat(s);
    return v > 0 ? v : null;
  },
  _detectarCategoria(t) {
    for (const entry of NLP_MAPA) {
      if (entry.palavras.some(p => t.includes(p))) return entry.cat;
    }
    return 'Outros';
  },
  _extrairData(t) {
    if (/ontem/.test(t)) {
      const d = new Date(); d.setDate(d.getDate()-1);
      return Utils.dataHoje().slice(0,8) + String(d.getDate()).padStart(2,'0');
    }
    const m = t.match(/dia\s+(\d{1,2})/);
    if (m) {
      const { mes, ano } = Utils.mesAtual();
      return `${ano}-${String(mes).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
    }
    return Utils.dataHoje();
  },
  _limparDesc(txt) {
    return txt.replace(/^(gastei|paguei|comprei|recebi|ganhei|investi)\s+/i,'')
              .replace(/\s+r\$[\d.,]+/gi,'').replace(/\s+[\d.,]+\s*reais?/gi,'')
              .trim() || txt;
  },
  _abrirPagarFatura(txtOriginal) {
    const cartoes = Storage.cartoes();
    const contas  = Storage.contas();
    if (!cartoes.length) { this._addMsg('app', '❌ Nenhum cartão cadastrado. Cadastre um cartão primeiro.', 'err'); return; }
    if (!contas.length)  { this._addMsg('app', '❌ Nenhuma conta bancária cadastrada. Cadastre uma conta primeiro.', 'err'); return; }
    const { mes, ano } = Utils.mesAtual();
    const cartOpts  = cartoes.map(c => {
      const fat = Fin.faturaCartao(c.id, mes, ano);
      return `<option value="${c.id}">${Utils.esc(c.nome)} — fatura ${Utils.moeda(fat)}</option>`;
    }).join('');
    const contaOpts = contas.map(c => `<option value="${c.id}">${Utils.esc(c.nome)}</option>`).join('');
    const valorSug  = this._extrairValor(txtOriginal.toLowerCase()) || '';
    Modal.abrir('💳 Pagamento de Fatura', `
      <div class="form-grupo"><label>Cartão</label>
        <select id="pf-cartao">${cartOpts}</select></div>
      <div class="form-grupo"><label>Conta que vai debitar</label>
        <select id="pf-conta">${contaOpts}</select></div>
      <div class="form-grupo"><label>Valor (R$)</label>
        <input id="pf-valor" type="number" step="0.01" min="0.01" placeholder="0,00" value="${valorSug}"></div>
      <div style="font-size:12px;color:var(--txt2);background:var(--sup2);border-radius:var(--raio-sm);padding:10px">
        💡 O valor será debitado da conta e reduzirá a fatura do cartão.
      </div>
    `, { onOk: () => {
      const cartaoId = document.getElementById('pf-cartao').value;
      const contaId  = document.getElementById('pf-conta').value;
      const valor    = parseFloat(document.getElementById('pf-valor').value) || 0;
      if (!cartaoId || !contaId || valor <= 0) { alert('Preencha todos os campos corretamente.'); return; }
      const cartao = cartoes.find(c => c.id === cartaoId);
      const conta  = contas.find(c => c.id === contaId);
      const arr = Storage.transacoes();
      arr.push({ id: Utils.uuid(), data: Utils.dataHoje(), descricao: 'Pagamento de fatura ' + cartao.nome,
        valor, tipo: 'fatura_cartao', categoria: null,
        contaId, cartaoId, contaDestinoId: null,
        parcelas: 1, parcelaAtual: 1, parcelaGrupoId: null });
      Storage.salvarTransacoes(arr);
      Modal.fechar();
      this._addMsg('app', `✅ Pagamento de ${Utils.moeda(valor)} registrado! Fatura ${cartao.nome} reduzida. Conta ${conta.nome} debitada.`, 'ok');
      if (Router.atual === 'cartoes') Telas.cartoes.render();
      if (Router.atual === 'lancamentos') Telas.lancamentos._renderLista();
      if (Router.atual === 'dashboard') Telas.dashboard.render();
    }});
  },
  _addMsg(de, msg, cls='') {
    this._hist.push({ de, msg, cls, ts: Date.now() });
    if (this._hist.length > 30) this._hist = this._hist.slice(-30);
    Storage.salvarChatHistorico(this._hist);
    this._renderMsg(de, msg, cls);
  },
  _renderMsg(de, msg, cls) {
    const el = document.getElementById('chat-hist');
    if (!el) return;
    const div = document.createElement('div');
    div.className = `chat-msg ${de}${cls?' '+cls:''}`;
    div.textContent = msg;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
  },
  renderHistorico() {
    const el = document.getElementById('chat-hist');
    if (!el) return;
    el.innerHTML = '';
    for (const h of this._hist) {
      const div = document.createElement('div');
      div.className = `chat-msg ${h.de}${h.cls?' '+h.cls:''}`;
      div.textContent = h.msg;
      el.appendChild(div);
    }
    el.scrollTop = el.scrollHeight;
  }
};

const BUCKET_NOMES = {
  'Alimentação / Mercado':'essencial','Transporte / Combustível':'essencial',
  'Cantina':'essencial','Conta de Água':'essencial','Aluguel':'essencial',
  'Telefone':'essencial','Saúde / Farmácia':'essencial','Empréstimo':'essencial',
  'Jiu Jitsu':'investimento','Educação':'investimento',
  'Lazer / Assinaturas':'lazer','Energético':'lazer','Outros':'lazer',
};
function bucketDaCategoria(catId) {
  const cat = Storage.categorias().find(c => c.id === catId);
  return cat ? (BUCKET_NOMES[cat.nome] || 'lazer') : 'lazer';
}

const Fin = {
  saldoConta(contaId) {
    const conta = Storage.contas().find(c => c.id === contaId);
    if (!conta) return 0;
    const hoje = Utils.dataHoje();
    let s = conta.saldoInicial || 0;
    for (const t of Storage.transacoes()) {
      if (t.data > hoje) continue;
      if (t.tipo === 'receita'      && t.contaId === contaId) s += t.valor;
      if (t.tipo === 'despesa'      && t.contaId === contaId) s -= t.valor;
      if (t.tipo === 'fatura_cartao'&& t.contaId === contaId) s -= t.valor;
      if (t.tipo === 'transferencia'&& t.contaId === contaId) s -= t.valor;
      if (t.tipo === 'transferencia'&& t.contaDestinoId === contaId) s += t.valor;
    }
    return s;
  },
  saldoTotal() {
    return Storage.contas().reduce((acc, c) => acc + this.saldoConta(c.id), 0);
  },
  periodoFatura(cartao, mes, ano) {
    const fd = cartao.diaFechamento;
    const ant = Utils.addMes(mes, ano, -1);
    const ultimoDiaAnt = Utils.ultimoDia(ant.mes, ant.ano).getDate();
    // Período começa NO dia de fechamento do mês anterior
    const diaIni = Math.min(fd, ultimoDiaAnt);
    const inicio = new Date(ant.ano, ant.mes - 1, diaIni);
    const ultimoDiaMes = Utils.ultimoDia(mes, ano).getDate();
    // Período termina NO DIA ANTERIOR ao fechamento (dia 4 fecha → último dia do período = dia 3)
    // new Date(ano, mes-1, 0) retorna último dia do mês anterior — cobre o caso fd=1
    const fimDia = Math.min(fd, ultimoDiaMes) - 1;
    const fim = fimDia < 1 ? new Date(ant.ano, ant.mes - 1, ultimoDiaAnt) : new Date(ano, mes - 1, fimDia);
    const dv = cartao.diaVencimento;
    const vencimento = new Date(ano, mes - 1, Math.min(dv, ultimoDiaMes));
    return { inicio, fim, vencimento };
  },
  transacoesCartao(cartaoId, mes, ano) {
    const cartao = Storage.cartoes().find(c => c.id === cartaoId);
    if (!cartao) return [];
    const { inicio, fim } = this.periodoFatura(cartao, mes, ano);
    return Storage.transacoes().filter(t => {
      if (t.cartaoId !== cartaoId || t.tipo !== 'despesa') return false;
      const d = new Date(t.data + 'T00:00:00');
      return d >= inicio && d <= fim;
    });
  },
  faturaCartao(cartaoId, mes, ano) {
    const charges  = this.transacoesCartao(cartaoId, mes, ano).reduce((acc, t) => acc + t.valor, 0);
    const payments = Storage.transacoes()
      .filter(t => t.tipo === 'fatura_cartao' && t.cartaoId === cartaoId && Utils.datasNoMes(t.data, mes, ano))
      .reduce((acc, t) => acc + t.valor, 0);
    return Math.max(0, charges - payments);
  },
  faturaAtual(cartaoId) {
    const { mes, ano } = Utils.mesAtual();
    return this.faturaCartao(cartaoId, mes, ano);
  },
  _periodosFatura(cartao) {
    const hoje = new Date();
    const diaHoje = hoje.getDate();
    const { mes, ano } = Utils.mesAtual();
    // No dia do fechamento (ou depois), a fatura já fechou → aberta é a do próximo mês
    const fechado = diaHoje >= cartao.diaFechamento ? { mes, ano } : Utils.addMes(mes, ano, -1);
    const aberto  = diaHoje >= cartao.diaFechamento ? Utils.addMes(mes, ano, 1) : { mes, ano };
    return { fechado, aberto };
  },
  faturaFechada(cartaoId) {
    const cartao = Storage.cartoes().find(c => c.id === cartaoId);
    if (!cartao) return 0;
    const { fechado } = this._periodosFatura(cartao);
    return this.faturaCartao(cartaoId, fechado.mes, fechado.ano);
  },
  faturaAberta(cartaoId) {
    const cartao = Storage.cartoes().find(c => c.id === cartaoId);
    if (!cartao) return 0;
    const { aberto } = this._periodosFatura(cartao);
    return this.faturaCartao(cartaoId, aberto.mes, aberto.ano);
  },
  totalComprometido(cartaoId) {
    // Soma TODAS as despesas no cartão menos todos os pagamentos feitos
    // Isso inclui parcelas de meses futuros — é o limite real já comprometido
    const txs = Storage.transacoes();
    const charges  = txs.filter(t => t.cartaoId === cartaoId && t.tipo === 'despesa')
                        .reduce((acc, t) => acc + t.valor, 0);
    const payments = txs.filter(t => t.cartaoId === cartaoId && t.tipo === 'fatura_cartao')
                        .reduce((acc, t) => acc + t.valor, 0);
    return Math.max(0, charges - payments);
  },
  resumoMensal(mes, ano) {
    let receitas = 0, despesas = 0;
    for (const t of Storage.transacoes()) {
      if (!Utils.datasNoMes(t.data, mes, ano)) continue;
      if (t.tipo === 'receita') receitas += t.valor;
      if (t.tipo === 'despesa') despesas += t.valor;
    }
    return { receitas, despesas, saldo: receitas - despesas };
  },
  orcamento5030(mes, ano) {
    const txs = Storage.transacoes().filter(t => Utils.datasNoMes(t.data, mes, ano));
    const receita = txs.filter(t => t.tipo === 'receita' && t.contaId).reduce((a,t)=>a+t.valor,0);
    const investMes = Storage.investimentos().filter(i=>Utils.datasNoMes(i.data,mes,ano)).reduce((a,i)=>a+i.valor,0);
    let essencial = 0, investimento = investMes, lazer = 0;
    for (const t of txs) {
      if (t.tipo !== 'despesa') continue;
      const b = bucketDaCategoria(t.categoria);
      if (b === 'essencial')    essencial    += t.valor;
      else if (b === 'investimento') investimento += t.valor;
      else lazer += t.valor;
    }
    const alvoE = receita * 0.50, alvoI = receita * 0.30, alvoL = receita * 0.20;
    return {
      receita,
      essencial:    { gasto: essencial,    alvo: alvoE, pct: alvoE ? Math.round(essencial/alvoE*100)    : 0, ok: essencial    <= alvoE },
      investimento: { gasto: investimento, alvo: alvoI, pct: alvoI ? Math.round(investimento/alvoI*100) : 0, ok: investimento >= alvoI },
      lazer:        { gasto: lazer,        alvo: alvoL, pct: alvoL ? Math.round(lazer/alvoL*100)        : 0, ok: lazer        <= alvoL },
    };
  },
  // Fluxo de caixa real: entradas = receitas; saídas = despesas pagas do banco + pagamentos de fatura
  fluxoCaixa(mes, ano) {
    let entradas = 0, saidas = 0;
    for (const t of Storage.transacoes()) {
      if (!Utils.datasNoMes(t.data, mes, ano)) continue;
      if (t.tipo === 'receita') entradas += t.valor;
      if (t.tipo === 'despesa' && t.contaId && !t.cartaoId) saidas += t.valor;
      if (t.tipo === 'fatura_cartao') saidas += t.valor;
    }
    return { entradas, saidas, resultado: entradas - saidas };
  },
  resumoAnual(ano) {
    let entradas = 0, saidas = 0;
    for (const t of Storage.transacoes()) {
      const d = new Date(t.data + 'T00:00:00');
      if (d.getFullYear() !== ano) continue;
      if (t.tipo === 'receita') entradas += t.valor;
      if (t.tipo === 'despesa' && t.contaId && !t.cartaoId) saidas += t.valor;
      if (t.tipo === 'fatura_cartao') saidas += t.valor;
    }
    return { entradas, saidas, resultado: entradas - saidas };
  },
  despesasPorCategoria(mes, ano) {
    const mapa = {};
    for (const t of Storage.transacoes()) {
      if (t.tipo !== 'despesa') continue;
      if (!Utils.datasNoMes(t.data, mes, ano)) continue;
      mapa[t.categoria] = (mapa[t.categoria] || 0) + t.valor;
    }
    const cats = Storage.categorias();
    const total = Object.values(mapa).reduce((a,b)=>a+b, 0);
    return Object.entries(mapa)
      .map(([id, val]) => {
        const c = cats.find(x => x.id === id) || { nome:'Outros', ico:'📦', cor:'#888' };
        return { id, nome: c.nome, ico: c.ico, cor: c.cor, total: val, pct: total ? Math.round(val/total*100) : 0 };
      })
      .sort((a,b) => b.total - a.total);
  },
  receitasPorCategoria(mes, ano) {
    const mapa = {};
    for (const t of Storage.transacoes()) {
      if (t.tipo !== 'receita') continue;
      if (!Utils.datasNoMes(t.data, mes, ano)) continue;
      mapa[t.categoria] = (mapa[t.categoria] || 0) + t.valor;
    }
    const cats = Storage.categorias();
    const total = Object.values(mapa).reduce((a,b)=>a+b, 0);
    return Object.entries(mapa)
      .map(([id, val]) => {
        const c = cats.find(x => x.id === id) || { nome:'Outros', ico:'🎁', cor:'#888' };
        return { id, nome: c.nome, ico: c.ico, cor: c.cor, total: val, pct: total ? Math.round(val/total*100) : 0 };
      })
      .sort((a,b) => b.total - a.total);
  },
  evolucao(n) {
    const res = [];
    let { mes, ano } = Utils.mesAtual();
    for (let i = n-1; i >= 0; i--) {
      const ref = Utils.addMes(mes, ano, -i);
      const r = this.resumoMensal(ref.mes, ref.ano);
      res.push({ mes: ref.mes, ano: ref.ano, label: new Date(ref.ano, ref.mes-1, 1).toLocaleDateString('pt-BR',{month:'short'}), ...r });
    }
    return res;
  },
  evolucaoSaldoMensal(nMeses) {
    const resultado = [];
    const hoje = new Date();
    for (let i = nMeses - 1; i >= 0; i--) {
      const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
      const ultimoDia = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      const dataFim = `${ultimoDia.getFullYear()}-${String(ultimoDia.getMonth()+1).padStart(2,'0')}-${String(ultimoDia.getDate()).padStart(2,'0')}`;
      const saldoTotal = Storage.contas().reduce((acc, conta) => {
        let s = conta.saldoInicial || 0;
        for (const t of Storage.transacoes()) {
          if (t.data > dataFim) continue;
          if (t.tipo === 'receita'       && t.contaId === conta.id) s += t.valor;
          if (t.tipo === 'despesa'       && t.contaId === conta.id) s -= t.valor;
          if (t.tipo === 'fatura_cartao' && t.contaId === conta.id) s -= t.valor;
          if (t.tipo === 'transferencia' && t.contaId === conta.id) s -= t.valor;
          if (t.tipo === 'transferencia' && t.contaDestinoId === conta.id) s += t.valor;
        }
        return acc + s;
      }, 0);
      const mes = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][d.getMonth()];
      resultado.push({ label: `${mes}/${String(d.getFullYear()).slice(2)}`, saldo: saldoTotal });
    }
    return resultado;
  },
  gastoCategoriaMes(catId, mes, ano) {
    return Storage.transacoes()
      .filter(t => t.tipo === 'despesa' && t.categoria === catId && Utils.datasNoMes(t.data, mes, ano))
      .reduce((a, t) => a + t.valor, 0);
  },
  analisarCortes(mes, ano) {
    const cats = Storage.categorias().filter(c => c.tipo === 'despesa');
    const txs  = Storage.transacoes();
    const atual = {};
    txs.filter(t => t.tipo === 'despesa' && Utils.datasNoMes(t.data, mes, ano))
       .forEach(t => { atual[t.categoria] = (atual[t.categoria] || 0) + t.valor; });
    const hist = {};
    for (let i = 1; i <= 3; i++) {
      const ref = Utils.addMes(mes, ano, -i);
      txs.filter(t => t.tipo === 'despesa' && Utils.datasNoMes(t.data, ref.mes, ref.ano))
         .forEach(t => { hist[t.categoria] = (hist[t.categoria] || 0) + t.valor; });
    }
    return cats
      .filter(c => atual[c.id] > 0)
      .map(c => {
        const media = (hist[c.id] || 0) / 3;
        const atualVal = atual[c.id] || 0;
        return { id: c.id, nome: c.nome, ico: c.ico, cor: c.cor,
          atual: atualVal, media, diff: atualVal - media, temHistorico: (hist[c.id] || 0) > 0 };
      })
      .sort((a, b) => b.diff - a.diff);
  }
};

/* ═══════════════════════════════════════════════════════════
   GRÁFICOS  (Canvas 2D puro)
═══════════════════════════════════════════════════════════ */
const Graf = {
  donut(canvasId, dados, total) {
    const c = document.getElementById(canvasId);
    if (!c) return;
    const ctx = c.getContext('2d');
    const W = c.width, H = c.height, cx = W/2, cy = H/2, r = Math.min(cx,cy)*0.7, ri = r*0.55;
    ctx.clearRect(0,0,W,H);
    if (!dados.length) {
      ctx.fillStyle = '#2E2E50'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#0F0F1A'; ctx.beginPath(); ctx.arc(cx,cy,ri,0,Math.PI*2); ctx.fill();
      return;
    }
    let ang = -Math.PI/2;
    for (const d of dados) {
      const slice = (d.total / total) * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,ang,ang+slice); ctx.closePath();
      ctx.fillStyle = d.cor; ctx.fill();
      ang += slice;
    }
    ctx.fillStyle = '#0F0F1A'; ctx.beginPath(); ctx.arc(cx,cy,ri,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#E9ECEF'; ctx.font = `bold 14px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(Utils.moeda(total), cx, cy);
  },
  barras(canvasId, dados) {
    const c = document.getElementById(canvasId);
    if (!c) return;
    const ctx = c.getContext('2d');
    const W = c.width, H = c.height;
    ctx.clearRect(0,0,W,H);
    if (!dados.length) return;
    const pad = 30, barW = Math.max(10, (W - pad*2) / dados.length / 2 - 4);
    const maxV = Math.max(...dados.map(d => Math.max(d.receitas, d.despesas)), 1);
    const chartH = H - 40;
    for (let i = 0; i < dados.length; i++) {
      const x = pad + i * ((W - pad*2) / dados.length) + (W - pad*2) / dados.length / 2;
      const rec = dados[i].receitas / maxV * chartH;
      const des = dados[i].despesas / maxV * chartH;
      ctx.fillStyle = '#06D6A0';
      ctx.fillRect(x - barW - 2, chartH - rec + 4, barW, rec);
      ctx.fillStyle = '#EF476F';
      ctx.fillRect(x + 2, chartH - des + 4, barW, des);
      ctx.fillStyle = '#9A9ABF'; ctx.font = '10px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(dados[i].label, x, H - 6);
    }
  },
  barrasEvolucao(canvasId, dados) {
    const c = document.getElementById(canvasId);
    if (!c) return;
    const ctx = c.getContext('2d');
    const W = c.width, H = c.height;
    ctx.clearRect(0, 0, W, H);
    if (!dados.length) return;
    const pad = 36;
    const chartH = H - 36;
    const minV = Math.min(...dados.map(d => d.saldo));
    const maxV = Math.max(...dados.map(d => d.saldo));
    const range = maxV - minV || 1;
    const pts = dados.map((d, i) => ({
      x: pad + (i / (dados.length - 1 || 1)) * (W - pad * 2),
      y: chartH - ((d.saldo - minV) / range) * (chartH - 20) - 4,
      saldo: d.saldo,
      label: d.label
    }));
    // Draw fill
    ctx.beginPath();
    ctx.moveTo(pts[0].x, chartH);
    pts.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.lineTo(pts[pts.length-1].x, chartH);
    ctx.closePath();
    ctx.fillStyle = 'rgba(108,99,255,0.15)';
    ctx.fill();
    // Draw line
    ctx.beginPath();
    pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.strokeStyle = '#6C63FF';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Draw dots + labels
    ctx.font = '10px system-ui';
    ctx.textAlign = 'center';
    pts.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = p.saldo >= 0 ? '#06D6A0' : '#EF476F';
      ctx.fill();
      ctx.fillStyle = '#9A9ABF';
      ctx.fillText(p.label, p.x, H - 4);
    });
  }
};

const Router = {
  telas: ['dashboard','contas','cartoes','lancamentos','investimentos','relatorios','ajuste','config'],
  atual: null,
  init() {
    window.addEventListener('hashchange', () => this._navegar());
    this._navegar();
  },
  _navegar() {
    const hash = location.hash.replace('#','') || 'dashboard';
    const tela = this.telas.includes(hash) ? hash : 'dashboard';
    if (this.atual === tela) return;
    this.atual = tela;
    document.querySelectorAll('.tela').forEach(el => el.classList.remove('ativa'));
    document.getElementById('tela-' + tela)?.classList.add('ativa');
    document.querySelectorAll('#nav a').forEach(a => {
      a.classList.toggle('ativo', a.dataset.tela === tela);
    });
    Telas[tela]?.render();
    const fab = document.getElementById('fab');
    fab.style.display = ['dashboard','lancamentos','contas','cartoes','investimentos'].includes(tela) ? '' : 'none';
  },
  ir(tela) { location.hash = tela; }
};

        </div>
        <div class="lista-acoes">
          <button class="btn btn-ghost btn-sm btn-icon" onclick="Telas.lancamentos.editar('${t.id}')">✏️</button>
          <button class="btn btn-ghost btn-sm btn-icon" onclick="Telas.lancamentos.excluir('${t.id}','${t.parcelaGrupoId||''}')">🗑️</button>
        </div>
      </div>`;
    }
    el.innerHTML = html;
  },
  novo(tipo) { this._form(null, tipo); },
  editar(id) { this._form(id); },
  _form(id, tipoInit) {
    const tx = id ? Storage.transacoes().find(x=>x.id===id) : null;
    const tipo = tx?.tipo || tipoInit || 'despesa';
    const contas  = Storage.contas();
    const cartoes = Storage.cartoes();
    const cats    = Storage.categorias();
    const contaOpts = contas.map(c=>`<option value="${c.id}"${tx?.contaId===c.id?' selected':''}>${Utils.esc(c.nome)}</option>`).join('');
    const contaDestOpts = contas.map(c=>`<option value="${c.id}"${tx?.contaDestinoId===c.id?' selected':''}>${Utils.esc(c.nome)}</option>`).join('');
    const cartOpts = cartoes.map(c=>`<option value="${c.id}"${tx?.cartaoId===c.id?' selected':''}>${Utils.esc(c.nome)}</option>`).join('');
    const catsDespOpts = cats.filter(c=>c.tipo!=='receita').map(c=>`<option value="${c.id}"${tx?.categoria===c.id?' selected':''}>${c.ico} ${Utils.esc(c.nome)}</option>`).join('');
    const catsRecOpts  = cats.filter(c=>c.tipo!=='despesa').map(c=>`<option value="${c.id}"${tx?.categoria===c.id?' selected':''}>${c.ico} ${Utils.esc(c.nome)}</option>`).join('');
    const tipoSel = (t) => tipo===t?'sel-'+t:'';
    Modal.abrir(id?'Editar Lançamento':'Novo Lançamento', `
      <div class="form-grupo"><label>Tipo</label>
        <div class="tipo-pill" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px" id="tipo-pill">
          <button type="button" data-tipo="despesa"  class="${tipoSel('despesa')}"  onclick="Telas.lancamentos._seltipo(this)">💸 Despesa</button>
          <button type="button" data-tipo="receita"  class="${tipoSel('receita')}"  onclick="Telas.lancamentos._seltipo(this)">💰 Receita</button>
          <button type="button" data-tipo="transferencia" class="${tipoSel('transferencia')}" onclick="Telas.lancamentos._seltipo(this)">🔀 Transf.</button>
          <button type="button" data-tipo="fatura_cartao" class="${tipoSel('fatura_cartao')}" onclick="Telas.lancamentos._seltipo(this)">💳 Fatura</button>
        </div></div>
      <div class="form-row">
        <div class="form-grupo"><label>Data</label>
          <input id="tx-data" type="date" value="${tx?.data||Utils.dataHoje()}"></div>
        <div class="form-grupo"><label>Valor (R$)</label>
          <input id="tx-valor" type="number" step="0.01" min="0.01" placeholder="0,00" value="${tx?.valor||''}">
          <div class="form-erro" id="tx-valor-err">Informe o valor</div></div>
      </div>
      <div class="form-grupo"><label>Descrição</label>
        <input id="tx-desc" type="text" placeholder="Ex: Supermercado" value="${Utils.esc(tx?.descricao||'')}">
        <div class="form-erro" id="tx-desc-err">Informe a descrição</div></div>

      <div id="campos-despesa" style="display:none">
        <div class="form-grupo"><label>Categoria</label>
          <select id="tx-cat-desp">${catsDespOpts}</select></div>
        <div class="form-grupo"><label>Conta</label>
          <select id="tx-conta-desp"><option value="">Nenhuma (só cartão)</option>${contaOpts}</select></div>
        <div class="form-grupo"><label>Cartão (opcional)</label>
          <select id="tx-cart-desp"><option value="">Nenhum</option>${cartOpts}</select></div>
        <div class="form-row">
          <div class="form-grupo"><label>Parcelas</label>
            <input id="tx-parc" type="number" min="1" max="48" value="${tx?.parcelas||1}" oninput="Telas.lancamentos._updParc(this.value)"></div>
          <div class="form-grupo"><label>&nbsp;</label>
            <div class="parcela-info" id="parc-info"></div></div>
        </div>
      </div>

      <div id="campos-receita" style="display:none">
        <div class="form-grupo"><label>Categoria</label>
          <select id="tx-cat-rec">${catsRecOpts}</select></div>
        <div class="form-grupo"><label>Conta</label>
          <select id="tx-conta-rec">${contaOpts}</select></div>
      </div>

      <div id="campos-transf" style="display:none">
        <div class="form-grupo"><label>Conta origem</label>
          <select id="tx-orig">${contaOpts}</select></div>
        <div class="form-grupo"><label>Conta destino</label>
          <select id="tx-dest">${contaDestOpts}</select></div>
      </div>

      <div id="campos-fatura" style="display:none">
        <div class="form-grupo"><label>Cartão que está pagando</label>
          <select id="tx-cart-fat"><option value="">Selecione o cartão</option>${cartOpts}</select></div>
        <div class="form-grupo"><label>Conta bancária que vai pagar</label>
          <select id="tx-conta-fat"><option value="">Selecione a conta</option>${contaOpts}</select></div>
        <div style="font-size:12px;color:var(--txt2);background:var(--sup2);border-radius:var(--raio-sm);padding:10px;margin-top:-8px">
          💡 O valor será debitado da conta bancária e reduzirá a fatura do cartão.
        </div>
      </div>
    `, { onOk: () => this._salvar(id) });
    this._mostrarCampos(tipo);
    this._updParc(tx?.parcelas||1);
  },
  _seltipo(btn) {
    const tipo = btn.dataset.tipo;
    document.querySelectorAll('#tipo-pill button').forEach(b => {
      b.className = b.dataset.tipo === tipo ? 'sel-'+tipo : '';
    });
    this._mostrarCampos(tipo);
  },
  _mostrarCampos(tipo) {
    const mapa = { despesa:'campos-despesa', receita:'campos-receita', transferencia:'campos-transf', fatura_cartao:'campos-fatura' };
    ['campos-despesa','campos-receita','campos-transf','campos-fatura'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
    const alvo = mapa[tipo];
    if (alvo) {
      const el = document.getElementById(alvo);
      if (el) el.style.display = 'block';
    }
  },
  _updParc(n) {
    const info = document.getElementById('parc-info');
    if (!info) return;
    const v = parseFloat(document.getElementById('tx-valor')?.value) || 0;
    const p = parseInt(n) || 1;
    if (p <= 1) { info.textContent = 'À vista'; return; }
    const cada = v / p;
    info.innerHTML = `${p}x de ${Utils.moeda(cada)}`;
  },
  _getTipoSel() {
    const sel = document.querySelector('#tipo-pill button[class^="sel-"]');
    return sel?.dataset.tipo || 'despesa';
  },
  _salvar(id) {
    const tipo  = this._getTipoSel();
    const valor = parseFloat(document.getElementById('tx-valor').value) || 0;
    const desc  = document.getElementById('tx-desc').value.trim();
    let valido = true;
    if (!valor || valor <= 0) { document.getElementById('tx-valor-err').classList.add('vis'); valido = false; }
    else document.getElementById('tx-valor-err').classList.remove('vis');
    if (!desc) { document.getElementById('tx-desc-err').classList.add('vis'); valido = false; }
    else document.getElementById('tx-desc-err').classList.remove('vis');
    if (tipo==='fatura_cartao') {
      const cartFat = document.getElementById('tx-cart-fat').value;
      if (!cartFat) { alert('Selecione o cartão que está sendo pago!'); return; }
    }
    if (!valido) return;
    const data = document.getElementById('tx-data').value || Utils.dataHoje();
    const arr = Storage.transacoes();
    if (id) {
      const tx = arr.find(x=>x.id===id);
      if (tx) {
        tx.data = data; tx.descricao = desc; tx.valor = valor; tx.tipo = tipo;
        if (tipo==='despesa') {
          tx.categoria = document.getElementById('tx-cat-desp').value;
          tx.contaId   = document.getElementById('tx-conta-desp').value || null;
          tx.cartaoId  = document.getElementById('tx-cart-desp').value || null;
          tx.contaDestinoId = null;
        } else if (tipo==='receita') {
          tx.categoria = document.getElementById('tx-cat-rec').value;
          tx.contaId   = document.getElementById('tx-conta-rec').value || null;
          tx.cartaoId  = null; tx.contaDestinoId = null;
        } else if (tipo==='transferencia') {
          tx.contaId  = document.getElementById('tx-orig').value || null;
          tx.contaDestinoId = document.getElementById('tx-dest').value || null;
          tx.cartaoId = null; tx.categoria = null;
        } else {
          tx.cartaoId = document.getElementById('tx-cart-fat').value || null;
          tx.contaId  = document.getElementById('tx-conta-fat').value || null;
          tx.contaDestinoId = null; tx.categoria = null;
        }
      }
      Storage.salvarTransacoes(arr);
      Modal.fechar(); this._renderLista(); toast('Lançamento atualizado!');
      if (_painelRefresh) { _painelRefresh(); _painelRefresh = null; }
      return;
    }
    // Novo lançamento
    const parcelas = tipo==='despesa' ? (parseInt(document.getElementById('tx-parc').value)||1) : 1;
    const grupoId  = parcelas > 1 ? Utils.uuid() : null;
    for (let p = 1; p <= parcelas; p++) {
      const [a,m,d2] = data.split('-').map(Number);
      const nd = Utils.addMes(m, a, p-1);
      const dataParc = `${nd.ano}-${String(nd.mes).padStart(2,'0')}-${String(d2).padStart(2,'0')}`;
      const tx = {
        id: Utils.uuid(), data: dataParc, descricao: desc,
        valor: parseFloat((valor/parcelas).toFixed(2)), tipo,
        parcelas, parcelaAtual: p, parcelaGrupoId: grupoId,
        categoria: null, contaId: null, cartaoId: null, contaDestinoId: null
      };
      if (tipo==='despesa') {
        tx.categoria = document.getElementById('tx-cat-desp').value;
        tx.contaId   = document.getElementById('tx-conta-desp').value || null;
        tx.cartaoId  = document.getElementById('tx-cart-desp').value || null;
      } else if (tipo==='receita') {
        tx.categoria = document.getElementById('tx-cat-rec').value;
        tx.contaId   = document.getElementById('tx-conta-rec').value || null;
      } else if (tipo==='transferencia') {
        tx.contaId  = document.getElementById('tx-orig').value || null;
        tx.contaDestinoId = document.getElementById('tx-dest').value || null;
      } else {
        tx.cartaoId = document.getElementById('tx-cart-fat').value || null;
        tx.contaId  = document.getElementById('tx-conta-fat').value || null;
      }
      arr.push(tx);
    }
    Storage.salvarTransacoes(arr);
    Modal.fechar(); this._renderLista();
    toast(parcelas>1 ? `${parcelas} parcelas criadas!` : 'Lançamento salvo!');
    if (_painelRefresh) { _painelRefresh(); _painelRefresh = null; }
  },
  excluir(id, grupoId) {
    if (grupoId) {
      const arr = Storage.transacoes();
      const qtd = arr.filter(t=>t.parcelaGrupoId===grupoId).length;
      if (qtd > 1) {
        Modal.abrir('Excluir parcela', `<p style="font-size:14px;line-height:1.7">Esta compra tem ${qtd} parcelas.<br>Deseja excluir:</p>
          <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
            <button class="btn btn-ghost" onclick="Telas.lancamentos._excluirUm('${id}')">Somente esta parcela</button>
            <button class="btn btn-perig" onclick="Telas.lancamentos._excluirGrupo('${grupoId}')">Todas as ${qtd} parcelas</button>
          </div>`, { footer: false });
        return;
      }
    }
    Modal.confirmar('Excluir este lançamento?', () => {
      Storage.salvarTransacoes(Storage.transacoes().filter(t=>t.id!==id));
      this._renderLista(); toast('Lançamento excluído.');
      if (_painelRefresh) { _painelRefresh(); _painelRefresh = null; }
    });
  },
  _excluirUm(id) {
    Modal.fechar();
    Storage.salvarTransacoes(Storage.transacoes().filter(t=>t.id!==id));
    this._renderLista(); toast('Parcela excluída.');
    if (_painelRefresh) { _painelRefresh(); _painelRefresh = null; }
  },
  _excluirGrupo(grupoId) {
    Modal.fechar();
    Storage.salvarTransacoes(Storage.transacoes().filter(t=>t.parcelaGrupoId!==grupoId));
    this._renderLista(); toast('Parcelas excluídas.');
    if (_painelRefresh) { _painelRefresh(); _painelRefresh = null; }
  }
};

function abrirImportarLote() {
  const cartoes = Storage.cartoes();
  const contas  = Storage.contas();
  const cartOpts = [`<option value="">Sem cartão (débito/dinheiro)</option>`,
    ...cartoes.map(c=>`<option value="${c.id}">${Utils.esc(c.nome)}</option>`)].join('');
  const contaOpts = [`<option value="">Nenhuma</option>`,
    ...contas.map(c=>`<option value="${c.id}">${Utils.esc(c.nome)}</option>`)].join('');
  const ref = Utils.addMes(Utils.mesAtual().mes, Utils.mesAtual().ano, -1);
  const dataPad = `${ref.ano}-${String(ref.mes).padStart(2,'0')}-15`;
  Modal.abrir('📋 Importar Lote de Gastos', `
    <p style="font-size:12px;color:var(--txt2);margin-bottom:12px">Cole uma despesa por linha: <strong>Descrição valor</strong><br>Ex: <em>Energético 9,99</em> ou <em>iFood 126,98</em></p>
    <div class="form-grupo"><label>Lista de gastos</label>
      <textarea id="lote-txt" style="height:180px;resize:vertical;width:100%;padding:10px;background:var(--sup2);border:1px solid var(--borda);border-radius:var(--raio-sm);color:var(--txt);font-family:var(--fonte);font-size:13px"
        placeholder="Energético 9,99&#10;Amazon Prime 18,90&#10;iFood 126,98&#10;Jiu Jitsu 260,00"
        oninput="previewLote()"></textarea></div>
    <div class="form-row">
      <div class="form-grupo"><label>Data de referência</label>
        <input id="lote-data" type="date" value="${dataPad}"></div>
      <div class="form-grupo"><label>Cartão de crédito</label>
        <select id="lote-cart">${cartOpts}</select></div>
    </div>
    <div id="lote-preview" style="margin-top:8px;font-size:12px;background:var(--sup2);border-radius:var(--raio-sm);padding:0"></div>
  `, { ok: '✅ Importar tudo', onOk: executarImportarLote });
}

function previewLote() {
  const txt = document.getElementById('lote-txt')?.value || '';
  const linhas = txt.split('\n').filter(l => l.trim());
  const el = document.getElementById('lote-preview');
  if (!el) return;
  if (!linhas.length) { el.innerHTML = ''; return; }
  let total = 0, rows = '';
  for (const l of linhas) {
    const v = Chat._extrairValor(l.toLowerCase());
    const catNome = Chat._detectarCategoria(l.toLowerCase());
    if (v) { total += v; rows += `<div style="display:flex;justify-content:space-between;padding:5px 10px;border-bottom:1px solid var(--borda)"><span style="color:var(--txt)">${Utils.esc(l.trim())}</span><span style="color:var(--receita);font-weight:700">${Utils.moeda(v)}</span></div>`; }
    else rows += `<div style="padding:5px 10px;color:var(--despesa)">⚠ Sem valor: ${Utils.esc(l.trim())}</div>`;
  }
  el.innerHTML = `<div style="padding:8px 10px;font-weight:700;color:var(--txt2);border-bottom:1px solid var(--borda)">${linhas.length} itens detectados</div>${rows}<div style="padding:8px 10px;font-weight:700;text-align:right;color:var(--despesa)">Total: ${Utils.moeda(total)}</div>`;
}

function executarImportarLote() {
  const txt     = document.getElementById('lote-txt')?.value || '';
  const data    = document.getElementById('lote-data')?.value || Utils.dataHoje();
  const cartaoId= document.getElementById('lote-cart')?.value || null;
  const linhas  = txt.split('\n').filter(l => l.trim());
  const cats    = Storage.categorias();
  const arr     = Storage.transacoes();
  let count = 0;
  for (const linha of linhas) {
    const t = linha.toLowerCase();
    const valor = Chat._extrairValor(t);
    if (!valor) continue;
    const catNome = Chat._detectarCategoria(t);
    const cat = cats.find(c => c.nome === catNome) || cats.find(c => c.nome === 'Outros') || cats[0];
    arr.push({ id: Utils.uuid(), data, descricao: linha.trim(), valor, tipo: 'despesa',
      categoria: cat?.id || null, contaId: null, cartaoId: cartaoId || null,
      contaDestinoId: null, parcelas: 1, parcelaAtual: 1, parcelaGrupoId: null });
    count++;
  }
  Storage.salvarTransacoes(arr);
  Modal.fechar();
  if (Router.atual === 'lancamentos') Telas.lancamentos._renderLista();
  if (Router.atual === 'dashboard')   Telas.dashboard.render();
  toast(`${count} lançamentos importados! 🎉`, 3000);
}

        <button class="tab-btn${this._aba==='balanco'?' ativo':''}" onclick="Telas.dashboard._aba='balanco';Telas.dashboard.render()">Balanço Geral</button>
      </div>`;

      <div class="mes-nav">
        <button onclick="Telas.dashboard._mudarMes(-1)">◀</button>
        <span class="mes-nome">${Utils.nomeMes(mes,ano)}</span>
